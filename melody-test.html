<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Melody test — refrain transcription</title>
<meta name="robots" content="noindex">
<style>
body{background:#0a0a0b;color:#e8e4d8;font-family:Georgia,serif;max-width:640px;margin:0 auto;padding:40px 20px}
h1{font-size:20px;font-weight:500}
p{color:#aaa494;font-size:14px;line-height:1.5}
.row{display:flex;gap:14px;align-items:center;margin:22px 0;flex-wrap:wrap}
button{background:none;border:1px solid rgba(201,168,92,.5);color:#c9a85c;font:inherit;font-size:15px;padding:8px 22px;cursor:pointer;border-radius:2px}
button:hover{border-color:#e0c992}
input[type=range]{width:180px}
.big{font-size:22px;color:#c9a85c;font-variant-numeric:tabular-nums}
table{border-collapse:collapse;font-size:13px;margin-top:18px;width:100%}
td,th{border-bottom:1px solid rgba(201,168,92,.15);padding:4px 8px;text-align:left;color:#aaa494}
tr.now td{color:#0a0a0b;background:#c9a85c}
label{color:#aaa494;font-size:13px}
</style>
</head>
<body>
<h1>Refrain transcription test</h1>
<p>The bare melody on the violin samples, scheduled on the audio hardware clock, with a metronome.
Adjust BPM freely — durations live in beats, so timing math never changes.
Judge against the record; report corrections per lyric.</p>
<div class="row">
  <button id="go">Play</button>
  <button id="stop">Stop</button>
  <label>BPM <input id="bpm" type="range" min="96" max="160" value="122"> <span id="bpmv">122</span></label>
  <label><input id="click" type="checkbox" checked> metronome</label>
</div>
<div class="row"><span class="big" id="pos">bar – · beat –</span></div>
<table id="tbl"><tr><th>#</th><th>bar</th><th>beat</th><th>len</th><th>note</th><th>lyric</th></tr></table>
<script>
/* [semitone rel E4, startBeat, durationBeats, vel, lyric] — 4/4, 8 bars.
   M1 checkpoint: B4 1.5 "Praise" / A4 .5 "The" / G4 1.5 "Lord" / A4 .5 "and" */
var MELODY = [
 [7,0,1.5,.72,"Praise"],[5,1.5,.5,.4,"The"],[3,2,1.5,.6,"Lord,"],[5,3.6,.4,.42,"and"],
 [7,4,.5,.78,"pass"],[7,4.5,.32,.3,"the"],[7,5,.75,.62,"am-"],[5,5.75,.25,.55,"mu-"],[2,6,.5,.38,"ni-"],[0,6.5,1.5,.68,"tion!"],
 [7,8,1.5,.72,"Praise"],[5,9.5,.5,.4,"The"],[3,10,1.5,.6,"Lord,"],[5,11.6,.4,.42,"and"],
 [7,12,.5,.78,"pass"],[7,12.5,.32,.3,"the"],[7,13,.75,.62,"am-"],[5,13.75,.25,.55,"mu-"],[2,14,.5,.38,"ni-"],[0,14.5,1.5,.68,"tion!"],
 [7,16,1.5,.72,"Praise"],[5,17.5,.5,.4,"The"],[3,18,1.5,.62,"Lord,"],[5,19.6,.4,.42,"and"],
 [7,20,.5,.78,"pass"],[7,20.5,.32,.3,"the"],[7,21,.75,.62,"am-"],[5,21.75,.25,.55,"mu-"],[2,22,.5,.38,"ni-"],[0,22.5,.5,.52,"tion"],[5,23,.5,.55,"and"],[7,23.5,.5,.6,"we'll"],
 [8,24,2,.72,"ALL"],[7,26,2,.68,"STAY"],
 [3,28,4,.75,"FREE"]
];
(function assert(){
 var end=MELODY[MELODY.length-1][1]+MELODY[MELODY.length-1][2];
 console.log("melody spans",end,"beats (expect 32)");
 for (var i=1;i<MELODY.length;i++)
  if (MELODY[i][1] < MELODY[i-1][1]+MELODY[i-1][2]-1e-6) console.error("overlap at",i);
})();
var SAMPLES=["a3","c4","e4","g4","a4","c5","e5","g5","a5"];
var BASES=[["a3",-7],["c4",-4],["e4",0],["g4",3],["a4",5],["c5",8],["e5",12],["g5",15],["a5",17]];
var NAMES={"-7":"A3","-4":"C4","-2":"D4","0":"E4","2":"F#4","3":"G4","5":"A4","7":"B4","8":"C5","10":"D5","12":"E5"};
var actx=null, buffers={}, timer=null, cues=[];
function voice(semi){var b=0,d=99;for(var i=0;i<BASES.length;i++){var dd=Math.abs(semi-BASES[i][1]);if(dd<d){d=dd;b=i}}
 return {n:BASES[b][0], rate:Math.pow(2,(semi-BASES[b][1])/12)}}
function wake(cb){
 if(!actx){actx=new (window.AudioContext||window.webkitAudioContext)();
  SAMPLES.forEach(function(n){fetch("audio/"+n+".wav").then(function(r){return r.arrayBuffer()}).then(function(ab){return actx.decodeAudioData(ab)}).then(function(b){buffers[n]=b})})}
 if(actx.state==="suspended")actx.resume();
 var wait=setInterval(function(){if(Object.keys(buffers).length===SAMPLES.length){clearInterval(wait);cb()}},80);
}
function note(n,rate,when,dur,vel){
 var b=buffers[n]; if(!b)return;
 var s=actx.createBufferSource(); s.buffer=b; s.playbackRate.value=rate;
 var g=actx.createGain();
 var a=Math.min(.08,dur*.25);
 g.gain.setValueAtTime(.0001,when);
 g.gain.exponentialRampToValueAtTime(.28+vel*.55,when+a);
 g.gain.setValueAtTime(.28+vel*.55,when+Math.max(a,dur*.8));
 g.gain.exponentialRampToValueAtTime(.0001,when+dur*.8+Math.min(.6,Math.max(.25,dur*.5)));
 s.connect(g); g.connect(actx.destination);
 s.start(when); s.stop(when+dur+1);
}
function tick(when,accent){
 var o=actx.createOscillator(), g=actx.createGain();
 o.frequency.value=accent?1568:1046; g.gain.setValueAtTime(accent?.12:.07,when);
 g.gain.exponentialRampToValueAtTime(.0001,when+.05);
 o.connect(g); g.connect(actx.destination); o.start(when); o.stop(when+.06);
}
var tbl=document.getElementById("tbl");
MELODY.forEach(function(e,i){
 var tr=document.createElement("tr"); tr.id="ev"+i;
 tr.innerHTML="<td>"+(i+1)+"</td><td>"+(Math.floor(e[1]/4)+1)+"</td><td>"+(e[1]%4+1)+"</td><td>"+e[2]+"</td><td>"+(NAMES[String(e[0])]||e[0])+"</td><td>"+e[4]+"</td>";
 tbl.appendChild(tr);
});
document.getElementById("bpm").oninput=function(){document.getElementById("bpmv").textContent=this.value};
document.getElementById("go").onclick=function(){
 wake(function(){
  var bpm=+document.getElementById("bpm").value, spb=60/bpm;
  var click=document.getElementById("click").checked;
  var t0=actx.currentTime+.3; cues=[];
  if(click) for(var b=0;b<32;b++) tick(t0+b*spb, b%4===0);
  MELODY.forEach(function(e,i){
   var v=voice(e[0]); note(v.n,v.rate,t0+e[1]*spb,e[2]*spb,e[3]);
   cues.push({i:i,at:t0+e[1]*spb});
  });
  if(timer)cancelAnimationFrame(timer);
  (function chase(){
   var at=actx.currentTime, beat=(at-t0)/spb, cur=-1;
   if(beat>=0&&beat<32) document.getElementById("pos").textContent="bar "+(Math.floor(beat/4)+1)+" · beat "+((Math.floor(beat)%4)+1);
   for(var i=0;i<cues.length;i++) if(cues[i].at<=at) cur=cues[i].i;
   for(var j=0;j<MELODY.length;j++) document.getElementById("ev"+j).className = (j===cur?"now":"");
   if(beat<33)timer=requestAnimationFrame(chase); else document.getElementById("pos").textContent="done";
  })();
 });
};
document.getElementById("stop").onclick=function(){if(actx){actx.close();actx=null;buffers={};if(timer)cancelAnimationFrame(timer);document.getElementById("pos").textContent="bar – · beat –"}};
</script>
</body>
</html>

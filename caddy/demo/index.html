/* =====================================================================
   50-pane.js   the pane shell.

   Function names match the shipping add-in's app.js on purpose
   (selectPaneTab, renderPaneTabs, closeFileTab, enterCompanion,
   enterChooser, renderBank, scanDefenses, switchAttorney,
   refreshCurrent), so an improvement here has an obvious counterpart
   in the product.

   Two structural facts the screen recording settled:

     1. Word draws its OWN task pane header above the add-in: a grey
        band with a bold "Caddy" and a round close button. The green
        band belongs to the add-in and sits under it. Word also floats
        a small dark chip over the green band's top right corner.
     2. Detaching moves the pane node itself into a window rather than
        re-rendering it, so the search text, the caret in that box, the
        open preview, every scroll position and every disclosure survive
        by construction rather than by remembering to save them.
   ===================================================================== */
(function (C) {
  "use strict";

  var P = {};
  var pane = null;      // the add-in itself. This node travels.
  var col = null;       // the docked column inside Word
  var host = null;      // Word's own grey header, docked only
  var grip = null;
  var floatWin = null;
  var floatRect = null; // where it floated last, so putting it away and
                        // asking for it back does not move it
  var docking = false;  // true only while redock() is driving the close

  var DETACH_AT = 8;    // px of travel on the band before the pane leaves
  var DOCK_BAND = 0.2;  // share of the Word window that counts as the edge
  var DOCK_CAP = 500;   // measured over at most this many px

  var VIEWS = ["home", "cases", "chooser", "companion", "viewer"];

  /* ---- build ------------------------------------------------------- */

  function build() {
    if (pane) return pane;

    var head = C.el("header.pane-head", null, [
      C.node(C.svg.mark(18, true)),
      C.el("h1", { text: "Caddy" }),
      C.el("button.pane-info", { type: "button", "aria-label": "About this add-in", text: "i" })
    ]);

    var tabs = C.el("nav#pane-tabs", { "aria-label": "Pane views", hidden: true }, [
      C.el("div#nav-tabs", null, [
        C.el("button.pane-tab#tab-cases", { type: "button", text: "Case files" }),
        C.el("button.pane-tab#tab-templates", { type: "button", text: "Templates" })
      ])
    ]);

    var home = C.el("main#view-home", null, [
      C.el("p#home-greeting", { text: "Where to first?" }),
      C.el("div.home-doors", null, [
        door("home-cases", C.svg.doorCases(40), "Case files"),
        door("home-templates", C.svg.doorTemplates(40), "Templates")
      ]),
      C.el("div.home-horizon", { "aria-hidden": "true" }, [
        C.node(C.svg.ground()),
        C.node(C.svg.farFlag(30)),
        C.node(C.svg.tuft(14, "#1c4429"))
      ])
    ]);

    var cases = C.el("main#view-cases", { hidden: true }, [
      C.el("div#case-head"),
      C.el("div#case-tree.scroll-list.tall.thin-scroll")
    ]);

    var chooser = C.el("main#view-chooser", { hidden: true }, [
      C.el("div#replace-bar.replace-bar", { hidden: true }, [
        C.el("span", { text: "Replace this document with..." }),
        C.el("button#btn-keep-current.link", { type: "button", text: "keep current" })
      ]),
      C.el("h2.lead", { text: "What kind of form?" }),
      C.el("input#form-search", { type: "search", placeholder: "Search the library..." }),
      C.el("div#section-list.scroll-list.tall.thin-scroll")
    ]);

    var companion = C.el("main#view-companion", { hidden: true }, [
      C.el("div#form-context"),
      C.el("section#attorney-section", null, [
        C.el("h2", { text: "Attorney" }),
        C.el("select#attorney-select", { "aria-label": "Signing attorney" }),
        C.el("div.slot-row", null, [
          C.el("label", null, [
            C.el("input#slot-cert", { type: "checkbox", checked: true }), " Certificate"
          ]),
          C.el("label", null, [
            C.el("input#slot-caption", { type: "checkbox", checked: true }), " Caption"
          ])
        ]),
        C.el("p#slot-report.slot-report")
      ]),
      C.el("section#defense-section", { hidden: true }, [
        C.el("h2", { text: "Defense bank" }),
        C.el("input#def-search", { type: "search", placeholder: "Search defenses..." }),
        C.el("select#def-part", { "aria-label": "Filter by part" }),
        C.el("div#def-list.scroll-list.thin-scroll"),
        C.el("h2.in-doc", null, [
          "In this document ",
          C.el("button#btn-refresh.link", { type: "button", title: "Rescan the document", text: "refresh" })
        ]),
        C.el("div#cur-list.scroll-list.short.thin-scroll")
      ]),
      C.el("div#objections-group", { hidden: true })
    ]);

    var viewer = C.el("main#view-viewer", { hidden: true });

    var status = C.el("p#pane-status", { role: "status" });

    var diag = C.el("details#diagnostics", null, [
      C.el("summary", { text: "Diagnostics" }),
      C.el("div.diag-row", null, [
        C.el("button#btn-census", { type: "button", text: "Census" }),
        C.el("button#btn-copy-diag", { type: "button", text: "Copy results" })
      ]),
      C.el("pre#diag-out", { hidden: true }),
      C.el("p.diag-motto", { text: "Caddy carries. You swing." })
    ]);

    pane = C.el("div#pane.pane", null, [head, tabs, home, cases, chooser, companion, viewer, status, diag]);

    /* Wiring that belongs to the shell. Every lookup is scoped to the
       node just built, because getElementById cannot see a subtree that
       is not in the document yet. */
    C.q(".pane-info", head).addEventListener("click", toggleInfo);
    C.q("#tab-cases", pane).addEventListener("click", function () { selectPaneTab("cases"); });
    C.q("#tab-templates", pane).addEventListener("click", function () { selectPaneTab("templates"); });
    C.q("#home-cases", pane).addEventListener("click", function () { selectPaneTab("cases"); });
    C.q("#home-templates", pane).addEventListener("click", function () { selectPaneTab("templates"); });
    head.addEventListener("dblclick", function (e) {
      if (e.target.closest("button")) return;
      selectPaneTab("home");
    });
    C.logoPutt && C.logoPutt.arm(head);

    /* One delegated listener on the strip. The close X sits inside its
       own tab, so it is checked first. */
    tabs.addEventListener("click", function (e) {
      var x = e.target.closest(".tab-file-close");
      if (x) { closeFileTab(x.parentNode.dataset.tab); return; }
      var t = e.target.closest(".pane-tab-file");
      if (t) selectPaneTab(t.dataset.tab);
    });

    C.q("#btn-census", pane).addEventListener("click", census);
    C.q("#btn-copy-diag", pane).addEventListener("click", copyDiag);

    C.store.on("ui.status", paintStatus);
    C.store.on("pane.tabs", renderPaneTabs);

    return pane;
  }

  function door(id, svg, label) {
    return C.el("button.home-row", { type: "button", id: id }, [
      C.node(svg),
      C.el("span.home-label", { text: label })
    ]);
  }

  /* ---- open, close, dock, float -------------------------------------- */

  P.open = function () {
    var word = C.word.el();
    if (!word) return;
    col = C.$("pane-col");
    build();

    if (!host) {
      /* Word draws one control on this band and it is a close. The
         pane comes off by dragging the band itself, which is the
         gesture the real thing uses, so a second button here would only
         compete with the drag for the same pixels. */
      host = C.el("div.pane-host", {
        title: "Drag to pull Caddy out of Word. Drag it back to the edge to dock it.",
        "aria-label": "Caddy pane title bar. Drag to float the pane. Drag it back to the edge, or double click, to dock it."
      }, [
        C.el("span.pane-host-name", { text: "Caddy" }),
        C.el("button.pane-host-x", { type: "button", "aria-label": "Close the Caddy pane" },
          [C.node(C.svg.icon("close", 11))])
      ]);
      C.q(".pane-host-x", host).addEventListener("click", P.close);
      wireHostDrag();

      grip = C.el("div.pane-grip", { role: "separator", "aria-orientation": "vertical",
        tabIndex: 0, "aria-label": "Resize the Caddy pane" });
      wireGrip();
    }

    if (C.store.get("pane.docked")) {
      C.clear(col);
      col.appendChild(grip);
      col.appendChild(host);
      col.appendChild(pane);
      col.hidden = false;
      col.classList.remove("pane-slot", "dock-near");
      setWidth(C.store.get("pane.width"));
    } else {
      /* It was floating when it was put away, so it comes back floating
         at the rect it had. A visitor who moved it does not want it
         moved back. */
      if (col) col.hidden = true;
      P.detach(floatRect, true);
    }

    C.store.set("pane.open", true);
    pane.classList.remove("pane-in");
    void pane.offsetWidth;
    pane.classList.add("pane-in");

    fillGreeting();
    /* The view is already in the store, but nothing has laid it out yet,
       so say it out loud and let showView set the classes it owns. */
    showView(C.store.get("pane.view") || "home");
    if (C.store.get("pane.probe") === "pending") C.cases.probe();
    C.reg.sync();
    return pane;
  };

  /* The X closes Caddy from either state. A floating pane that redocked
     itself instead would answer a close with a move, which is the one
     thing a close must never do. The node still goes home, so the open
     preview and every scroll position survive being put away. */
  P.close = function () {
    if (floatWin) { docking = false; floatWin.close(); return; }
    C.store.set("pane.open", false);
    if (col) col.hidden = true;
    C.reg.sync();
  };

  /* Whatever state the pane is in, the ribbon button brings it back.
     There is no fifth state, and none of the four is a dead end. */
  P.toggle = function () {
    if (floatWin) {
      if (floatWin.state === "minimized") { floatWin.restore(); return; }
      if (!C.store.get("pane.open")) { C.store.set("pane.open", true); C.reg.sync(); }
      floatWin.focus();
      return;
    }
    if (C.store.get("pane.open") && C.store.get("pane.docked") && col && !col.hidden) P.close();
    else P.open();
  };

  P.visible = function () {
    if (!C.store.get("pane.open")) return false;
    if (floatWin) return floatWin.state !== "minimized";
    return !!(col && !col.hidden);
  };

  /* Detaching moves the same node. Focus, scroll and selection are the
     three things reparenting resets, so they are snapshotted and put
     back synchronously, and transitions are muted for one frame so the
     move does not replay an entrance. */
  P.detach = function (rect, silent) {
    if (!pane || floatWin) return;
    var snap = snapshot(pane);
    var docSel = C.docview.mark();
    var box = C.wm.desk();
    var w = C.store.get("pane.width");
    var wordRect = C.wm.get("word") ? C.wm.get("word").rect() : { x: 0, y: 0, w: box.clientWidth, h: box.clientHeight };
    var tall = Math.min(640, box.clientHeight - 140);
    var r = rect || floatRect || {
      x: Math.min(box.clientWidth - w - 24, wordRect.x + wordRect.w - w - 18),
      y: wordRect.y + 96,
      w: w, h: tall
    };

    pane.classList.add("no-anim");
    floatWin = C.wm.create({
      id: "caddy",
      title: "Caddy",
      cls: "win-caddy",
      x: Math.round(r.x), y: Math.round(r.y),
      w: Math.round(r.w || w), h: Math.round(r.h || tall),
      minW: 320, minH: 440,
      /* Off the dock it is still Word's pane, so it stays over the
         document. Clicking the page used to bury it. */
      onTop: true,
      dockIconEl: function () { return C.q("#dock-min .dock-min-caddy"); },
      onTitleDblClick: function () { P.redock(); return true; },
      onClose: function () {
        floatRect = floatWin ? floatWin.rect() : floatRect;
        floatWin = null;
        if (docking) { redock(false); return true; }
        /* The red light means close, so the column stays hidden and the
           store remembers that the pane was floating when it went. */
        redock(true);
        C.store.set("pane.docked", false);
        C.store.set("pane.open", false);
        C.reg.sync();
        return true;
      }
    });

/* =====================================================================

        return (f.title + " " + f.name + " " + (f.desc || "")).toLowerCase().indexOf(q) >= 0;
      });

        body.hidden = !openSections[sec.key];

        var row = C.el("div.sec-form", { title: f.name }, [
          C.el("span.sf-name", { text: f.title })

        var peek = C.el("button.sf-peek", { type: "button",
          title: "Look at this form first", "aria-label": "Preview " + f.title },

      if (b.k === "party") {
        page.appendChild(C.el("p.p.k-party" + (b.rule ? ".ruled" : ""), null, [
          C.el("span.pn", { text: b.t || "" }),
          C.el("span.role", { text: b.role || "" })

      page.appendChild(C.el("p.p.k-" + b.k + (b.u ? ".u" : ""), { html: C.inline(b.t || "") }));

   One putt gets you in. Drag back from anywhere, let go, and the ball
   leaves on the opposite line, which is the slingshot every popular
   mobile golf game settled on. The two that use a timing meter instead
   are selling perfect-shot upgrades; the studio that shipped arrows and
   a power bar replaced them with drag-and-release because players lined
   up faster. Drag starts anywhere rather than on the ball, because on a
   phone a finger on the ball covers the thing being aimed.

   This is the first persistent animation loop in this build, so it
   carries the rules the rest of the file assumes: one loop for
   everything, it stops itself the moment nothing is moving, it reads
   C.env.calm every frame because that is a live getter and not a cached
   value, it integrates on elapsed time so a 120Hz phone does not run
   the ball at double speed, and it writes nothing but transform and
   opacity.

   has near-constant rolling resistance, so velocity decays linearly and
   the ball actually stops rather than creeping forever. The hole is
   speed-dependent: a ball dead on line still lips out if it arrives too
   hot, which is real and is the difference between a miss that feels
   earned and a miss that feels arbitrary.

  var GUIDE_MAX = 110;

  C.on(document, "pointerdown", function () {
    if (plate && !plate.hidden && Date.now() - shown > 1200) G.dismiss();
  }, { capture: true });

  G.reopen = function () {
    if (plate) { plate.hidden = false; }
    else show(0);
  };

  G.off = function () {
    C.store.set("ui.guideOn", false);
    G.dismiss();
  };

  /* The one callout: a red hairline from the document's own path to
     the case Caddy resolved from it. Dismissible, and it never comes
     back. */
  G.callout = function () {
    if (seen.callout || !C.store.get("pane.callout")) return;
    var target = C.q(".case-row .case-name");
    var src = C.q(".wd-docname");
    /* Wait until the case view is actually on screen. Measuring a
       hidden node gives a rect at the origin, and the card lands in the
       corner of the screen pointing at nothing. */
    if (!target || !src || !target.getClientRects().length) {
      var un = C.store.on("pane.view", function (v) {
        if (v !== "cases") return;
        un();
        setTimeout(G.callout, 60);
      });
      return;
    }
    seen.callout = true;

    /* The path is the evidence, so it is drawn as a path rather than
       bolded inside a sentence. A card that lists three things in bold
       and then offers a button reads as a system dialog, and this is
       the best moment in the product. */
    var crumbs = C.el("div.callout-path", { "aria-label": "The path this document was opened from" });
    (C.pack.DOC_PATH || []).forEach(function (seg, i) {
      if (i) crumbs.appendChild(C.el("i.callout-sep", { "aria-hidden": "true", text: "\u203a" }));
      crumbs.appendChild(C.el("span", { text: seg }));
    });

    var box = C.el("div.callout", { role: "status", "aria-live": "polite" }, [
      C.el("b.callout-lead", { text: "It found the case" }),
      crumbs,
      C.el("p", { text: "Caddy read the path your draft lives at. Nobody told it the matter, and nothing guessed." })
    ]);
    var line = C.el("i.callout-line");
    var stage = C.$("stage");
    stage.appendChild(line);
    stage.appendChild(box);

    /* One short elbow, from the card to the case it is pointing at.
       A line drawn all the way across the application reads as a stray
       hairline, not as an explanation. */
    var place = function () {
      var b = C.rect(target);
      var w = window.innerWidth;
      var pane = C.q("#pane-col") || C.q(".win-caddy");
      var edge = pane && pane.getClientRects().length ? C.rect(pane).x : b.x;
      var left = C.clamp(edge - 268, 12, w - 262);
      box.style.left = left + "px";
      box.style.top = (b.y - 10) + "px";
      line.style.left = (left + 250) + "px";
      line.style.top = (b.y + 5) + "px";
      line.style.width = Math.max(6, b.x - (left + 250) - 2) + "px";
      line.style.height = "1px";
    };
    place();
    var off = C.on(window, "resize", place);

    var closed = false;
    var close = function () {
      if (closed) return;
      closed = true;
      offDown();
      box.remove(); line.remove(); off();
      C.store.set("pane.callout", false);
    };
    /* No button. The next thing the visitor does closes it, with a
       floor under it so it cannot vanish before it can be read. */
    var born = Date.now();
    var offDown = C.on(document, "pointerdown", function () {
      if (Date.now() - born > 1400) close();
    }, { capture: true });
    /* It belongs to the case view. Leave that view and it goes. */
    var un = C.store.on("pane.view", function (v) { if (v !== "cases") { un(); close(); } });
    setTimeout(close, 12000);
  };

  C.guide = G;

  /* ================================================================ */
  /* The about card. The only marketing on the page, and it lives
     behind the product rather than in front of it.                   */
  /* ================================================================ */

  C.about = {
    open: function () {
      if (C.$("about-scrim")) return;
      var c = C.reg.census();
      var scrim = C.el("div#about-scrim.scrim");
      var card = C.el("div.about", { role: "dialog", "aria-modal": "true", "aria-label": "About Caddy" }, [
        C.el("div.lock", null, [
          C.node(C.svg.lockMark(26, false)),
          C.el("span", { style: { "font-weight": "800", "letter-spacing": "1px", "font-size": "18px" }, text: "Caddy" }),
          C.el("span", { style: { "font-size": "9.5px", "letter-spacing": ".4em",
            "text-transform": "uppercase", color: "var(--muted)" }, text: "by M" })
        ]),
        C.el("h2", { text: "Somewhere on the office drive sits the best motion your firm ever filed, doing nothing." }),
        C.el("p", { text: "Caddy lives in a side pane of Microsoft Word and hands your own filed work back to you at the moment of the shot. Case files open docked beside the draft, a tab per document. The firm's own forms insert with the right attorney block, caption and certificate." }),
        C.el("div.rule"),
        C.el("p", { html: "<b>Not AI.</b> Nothing here guesses, drafts or summarizes. Caddy knows which document you have open because it read the file path, and it knows your forms because your firm gave them to it. That is all it knows." }),
        C.el("p", { html: "<b>Not a cloud service.</b> It runs on the drafting machine. The firm's content never leaves the building." }),
        C.el("p", { html: "<b>Not a content pack.</b> Caddy ships with no legal language in it. The library is the firm's own." }),
        C.el("p", { html: "<b>Not a substitute for judgment.</b> It moves the paper so the lawyer can do the lawyering." }),
        C.el("div.rule"),
        C.el("p.fine", { text:
          "About this page. Everything in it is invented: the firm, the attorneys, the matter, " +
          "the drive, the forms and the defenses were written for this demonstration. No firm's " +
          "filed work appears anywhere in it. Nothing you do here is saved and nothing leaves " +
          "the page: there is no network request of any kind." }),
        C.el("p.fine", { text:
          "The word processor around the pane is a simulation, written from scratch for this " +
          "demonstration. Caddy is not affiliated with, endorsed by or sponsored by Microsoft. " +
          "Microsoft and Microsoft Word are trademarks of the Microsoft Corporation." }),
        C.el("p.fine", { text:
          "Controls drawn in this simulation: " + c.total + ". Live: " + c.live +
          ". Drawn and deliberately inert, each one saying so when you click it: " + c.inert + "." }),
        C.el("button.close", { type: "button", text: "Back to the workspace" })
      ]);
      scrim.appendChild(card);
      C.$("stage").appendChild(scrim);
      var close = function () { scrim.remove(); };
      C.q(".close", card).addEventListener("click", close);
      scrim.addEventListener("click", function (e) { if (e.target === scrim) close(); });
      document.addEventListener("keydown", function esc(e) {
        if (e.key === "Escape") { close(); document.removeEventListener("keydown", esc); }
      });
      C.focusFirst(card);
    }
  };

})(window.C = (window.C || {}));

/* =====================================================================
   99-main.js   boot order and the scene handoff.
   ===================================================================== */
(function (C) {
  "use strict";

  var S = {};

  S.toDesk = function () {
    C.store.set("scene", "desk");
    if (!C.wm.get("finder") && C.store.get("desk.finderOpen") !== false) C.desk.openFinder();
    C.guide.step("desk");
  };

  S.toWord = function (docKey) {
    C.store.set("scene", "word");
    C.desk.launchWord(docKey);
  };

  C.scene = S;

  function boot() {
    var stage = C.el("div#stage");
    document.body.appendChild(stage);

    C.desk.mount(stage);

    /* Seed the two comments a clerk would have left on this draft. */
    C.store.on("doc.loaded", function (key) {
      if (key !== "reply-msj") return;
      var blocks = C.doc.blocks;
      var picks = [];
      for (var i = 0; i < blocks.length && picks.length < 2; i++) {
        if (blocks[i].k === "body" && C.doc.text(blocks[i]).length > 200) picks.push(blocks[i].id);
      }
      if (picks.length) {
        C.comments.seed([
          { bid: picks[0], who: "Duffer Shank III", when: "Yesterday, 4:12 PM",
            text: "Record cite for this is at 84:11-19. Pulled the page into the case folder." },
          { bid: picks[1] || picks[0], who: "Chip Bogey", when: "Today, 8:40 AM",
            text: "Tighten this before it goes. And check the threshold number against the bills." }
        ]);
      }
    });

    /* The pane's own hooks into the guide. */
    C.store.on("pane.open", function (on) { if (on) C.guide.step("pane"); });
    C.store.on("pane.matter", function (m) {
      if (!m) return;
      setTimeout(function () { C.guide.callout(); }, 260);
    });
    C.store.on("pane.view", function (v) {
      if (v === "chooser" || v === "companion") C.guide.step("templates");
    });

    /* Cmd+/ brings the caddy back. */
    document.addEventListener("keydown", function (e) {
      if ((e.metaKey || e.ctrlKey) && e.key === "/") { e.preventDefault(); C.guide.reopen(); }
    });

    /* Diagnostics can reach the state the old build could never show. */
    C.store.on("pane.probe", function () {});

    C.green.mount(stage);
    C.reg.paint(document);
  }

  if (document.readyState === "loading")
    document.addEventListener("DOMContentLoaded", boot);
  else boot();

})(window.C = (window.C || {}));

</script>

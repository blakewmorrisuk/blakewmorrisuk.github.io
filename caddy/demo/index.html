<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<meta name="robots" content="noindex">
<title>Caddy</title>
<!--
  CADDY  -  the workspace demo.

  One self-contained file. No fonts, no CDN, no fetch, no network of
  any kind. Built from src/ by build.mjs; never hand-edited.

  Everything here is invented. Bogey, Mulligan & Shank PLLC, the
  Divot matter, the drive, the forms and the defenses were written
  for this demonstration. No firm's filed work appears anywhere in
  this file, and none ever should.

  Caddy is not affiliated with, endorsed by, or sponsored by
  Microsoft. Microsoft and Microsoft Word are trademarks of the
  Microsoft Corporation. What this page draws is a simulation of a
  word processor, written from scratch, for the purpose of showing
  what a task pane feels like without asking anyone to install one.
-->
<style>

/* ================================================================
   src/css/00-tokens.css
   ================================================================ */
/* =====================================================================
   00-tokens.css

   The only file allowed to name a color or a z-index. Everything else
   spends these.

   The product tokens are copied from the shipping pane's app.css and
   must not drift from it. The token NAMES kept their navy-era spelling
   there so nothing downstream had to rename, and that is preserved
   here too, with one exception: this file calls the green green.
   ===================================================================== */

@layer reset, tokens, wm, scene, chrome, doc, pane, state;

:root {
  /* ---- Caddy product palette. Flat fills, one red accent where the
     action lives, no gradients, no pills. Light on purpose: the pane
     lives inside Word. ------------------------------------------- */
  --green:      #1c4429;   /* header band, dark title bars           */
  --green-soft: #2c5c3c;   /* hover on dark, secondary dark          */
  --ink:        #1e2a22;   /* body text                              */
  --muted:      #55604d;   /* secondary text                         */
  --line:       #d8ded2;   /* borders, dividers                      */
  --bg:         #ffffff;   /* pane background                        */
  --panel:      #f2f5ef;   /* cards, wells, tab strip                */
  --accent:     #b23a2b;   /* flag red: active tab, links, Pop out   */
  --danger:     #8c2f2f;   /* errors, remove, confirm                */
  --ok:         #2e5e34;   /* success                                */
  --warn:       #7a5c1e;   /* warnings                               */
  --ground:     #e4e9df;   /* the horizon fill and the viewer well   */
  --confirm-bg: #fbf3f3;   /* the one off-white in the pane          */
  --v-btn-line: #6f9480;   /* viewer bar button border               */

  /* Flag red on dark green. Decorative SVG fills only, 3.5:1. */
  --flag-on-dark: #ff7a52;

  /* ---- The world outside Word. Dusk on a green. ----------------- */
  --desk-0:    #0b1410;
  --desk-1:    #12201a;
  --desk-2:    #1a3026;
  --desk-3:    #244633;
  --desk-line: #2a3b2f;
  --desk-ink:  #e9efe8;
  --desk-dim:  #9dae9f;

  /* ---- Word for Mac chrome. Registered on purpose so the host
     reads colorless and the pane is the only thing with a hue. --- */
  --w-qat:     #e8e8e6;
  --w-bar:     #f4f4f2;
  --w-ribbon:  #fbfbfa;
  --w-line:    #d7d7d2;
  --w-line-2:  #e8e8e3;
  --w-ink:     #1f1f1d;
  --w-dim:     #6a6a63;
  --w-blue:    #185abd;
  --w-canvas:  #d3d5d0;
  --w-sel:     #b4d5fe;   /* selection blue inside the document      */
  --w-hover:   #ebebe8;
  --w-press:   #dededa;

  /* Traffic lights. */
  --tl-red:    #ff5f57;
  --tl-amber:  #febc2e;
  --tl-green:  #28c840;
  --tl-off:    #cfcfca;

  /* ---- Type. No web fonts anywhere, by contract. --------------- */
  --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, "Helvetica Neue", sans-serif;
  --display: "Iowan Old Style", "Palatino Linotype", Palatino, "Book Antiqua", Georgia, serif;
  --doc: "Times New Roman", Times, "Liberation Serif", Tinos, serif;
  --mono: ui-monospace, Menlo, Consolas, "Courier New", monospace;

  /* ---- Space. The pane's own scale, kept. ---------------------- */
  --s1: 2px;  --s2: 4px;  --s3: 6px;  --s4: 8px;
  --s5: 10px; --s6: 12px; --s7: 14px; --s8: 18px; --s9: 24px;

  /* ---- Radius. 4 is the system default; 8 for the doors only. -- */
  --r-chip: 3px;
  --r:      4px;
  --r-door: 8px;
  --r-win:  10px;

  /* ---- Depth. The product has no drop shadows. The world outside
     Word does, because windows sit above a desk. ----------------- */
  --lift-1: 0 1px 2px rgba(6, 14, 10, .16), 0 4px 12px rgba(6, 14, 10, .14);
  --lift-2: 0 8px 24px rgba(6, 14, 10, .30), 0 32px 64px rgba(6, 14, 10, .34);
  --lift-3: 0 12px 32px rgba(6, 14, 10, .38), 0 48px 96px rgba(6, 14, 10, .42);

  /* ---- Motion. Four curves, four durations, and a switch. -------- */
  --ease: cubic-bezier(.32, .72, 0, 1);
  --ease-soft: cubic-bezier(.4, 0, .2, 1);

  /* A golf ball on a green has near-constant rolling resistance, so
     velocity decays linearly and distance is quadratic: p = vt - at^2/2.
     This is that curve exactly, the degree-elevated quadratic through
     (0,0) (.5,1) (1,1), which reduces to y = 2x - x^2.

     It matters which one you pick. At the halfway point this sits at
     75%. A plain ease-out sits at 68.5% and the ball reads as still
     being driven; easeOutCubic sits at 87.2% and the ball dies at once
     and then creeps, which reads as mud rather than grass. */
  --roll: cubic-bezier(.333, .667, .667, 1);

  /* Leaving. Things exiting the screen accelerate and are not allowed
     to decelerate, because a departure that settles reads as arriving
     somewhere. Material's emphasized-accelerate: only 15% of the
     distance is covered in the first 80% of the time. */
  --ease-exit: cubic-bezier(.3, 0, .8, .15);

  --t-1: 120ms;
  --t-2: 190ms;
  --t-3: 320ms;
  --t-4: 620ms;

  /* The entry roll. Slow enough to read as a ball rolling, which the
     900ms it replaced was not. */
  --t-roll: 1500ms;

  /* ---- Stacking. Raw z-index anywhere else fails the build.
     Windows are assigned 1000 and up by the window manager and are
     renumbered when they pass 3000, so nothing here may sit between
     1000 and 3000. ------------------------------------------------ */
  --z-below:    -1;
  --z-base:      0;
  --z-raise:     2;
  --z-sticky:    5;
  --z-chrome:   10;
  --z-overlay:  20;
  --z-desk:    100;
  --z-dock:   3400;
  --z-guide:  3500;
  --z-menubar:3600;
  --z-scrim:  3700;
  --z-modal:  3800;
  --z-green:  5000;
  --z-live:   9000;

  /* ---- Geometry the layout leans on. --------------------------- */
  --pane-w: 348px;          /* the pane's own canonical column       */
  --pane-min: 296px;
  --pane-max: 720px;
  --sheet-w: 660px;         /* the paper, before zoom                */
  --doc-zoom: 1;
  --menubar-h: 26px;
  --dock-h: 74px;
}


/* ================================================================
   src/css/10-base.css
   ================================================================ */
/* =====================================================================
   10-base.css   reset, the painted ground, focus, and the few utilities
   every layer uses.
   ===================================================================== */

@layer reset {
  *, *::before, *::after { box-sizing: border-box; }
  * { margin: 0; padding: 0; }

  html, body { height: 100%; }

  /* Both grounds are painted. The desk is dark because it is a desk at
     dusk; the pane is light because it lives inside Word. Neither one
     inherits, so the viewer's own theme never bleeds through. */
  body {
    background: var(--desk-0);
    color: var(--desk-ink);
    font: 15px/1.5 var(--sans);
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
    overflow: hidden;
    overscroll-behavior: none;
    text-rendering: optimizeLegibility;
  }

  button, input, select, textarea {
    font: inherit;
    color: inherit;
    background: none;
    border: 0;
  }
  button { cursor: pointer; }
  svg { display: block; }
  ul, ol { list-style: none; }
  [hidden] { display: none !important; }
}

@layer tokens {
  /* One focus ring for the whole page. Visible, never suppressed. */
  :focus-visible {
    outline: 2px solid var(--green-soft);
    outline-offset: 1px;
    border-radius: 2px;
  }
  .on-dark :focus-visible,
  .win-title :focus-visible { outline-color: var(--flag-on-dark); }

  /* Screen-reader-only, and the single live region the whole page
     speaks through. */
  .sr {
    position: absolute;
    width: 1px; height: 1px;
    margin: -1px; padding: 0;
    overflow: hidden;
    clip: rect(0 0 0 0);
    clip-path: inset(50%);
    white-space: nowrap;
    border: 0;
  }
  #a11y-live {
    position: fixed;
    left: -9999px; top: 0;
    z-index: var(--z-live);
  }

  /* Nothing here scrolls the page itself. */
  #stage {
    position: fixed;
    inset: 0;
    overflow: hidden;
    isolation: isolate;
  }

  /* A scrollbar that does not shout inside a simulated desktop. */
  .thin-scroll { scrollbar-width: thin; }
  .thin-scroll::-webkit-scrollbar { width: 11px; height: 11px; }
  .thin-scroll::-webkit-scrollbar-thumb {
    background: rgba(30, 42, 34, .26);
    border: 3px solid transparent;
    border-radius: 8px;
    background-clip: content-box;
  }
  .thin-scroll::-webkit-scrollbar-thumb:hover { background-color: rgba(30, 42, 34, .42); }
  .thin-scroll::-webkit-scrollbar-track { background: transparent; }

  .no-scrollbar { scrollbar-width: none; }
  .no-scrollbar::-webkit-scrollbar { width: 0; height: 0; }

  /* While a window is being dragged the whole page stops selecting and
     stops recomputing hover inside the moving frame. */
  body.wm-dragging { cursor: inherit; user-select: none; -webkit-user-select: none; }
  body.wm-dragging * { user-select: none !important; -webkit-user-select: none !important; }
  body.wm-dragging .win-body { pointer-events: none; }

  /* Suppress every transition for exactly one frame. Used when a node
     is reparented, so the move does not replay an entrance. */
  .no-anim, .no-anim * {
    transition: none !important;
    animation: none !important;
  }
}


/* ================================================================
   src/css/20-windows.css
   ================================================================ */
/* =====================================================================
   20-windows.css   the frame every window wears.
   ===================================================================== */

@layer wm {
  #desk-windows {
    position: absolute;
    left: 0; right: 0;
    top: var(--menubar-h);
    bottom: 0;
    overflow: hidden;
  }

  .win {
    position: absolute;
    display: flex;
    flex-direction: column;
    min-width: 0;
    background: var(--w-bar);
    border-radius: var(--r-win);
    box-shadow: var(--lift-2);
    overflow: hidden;
    color: var(--w-ink);
    /* A window is its own containment scope, so a resize cannot make
       the rest of the page recompute. */
    contain: layout paint;
  }
  .win.focused { box-shadow: var(--lift-3); }
  .win.zoomed { border-radius: 0; }

  .win.wm-anim { transition: left var(--t-3) var(--ease), top var(--t-3) var(--ease),
                             width var(--t-3) var(--ease), height var(--t-3) var(--ease); }
  .win.wm-live { will-change: transform; }

  /* ---- title bar ------------------------------------------------- */

  .win-title {
    flex: none;
    display: flex;
    align-items: center;
    gap: 10px;
    min-height: 28px;
    padding: 0 10px;
    background: var(--w-qat);
    border-bottom: 1px solid var(--w-line);
    cursor: default;
    user-select: none;
    -webkit-user-select: none;
    touch-action: none;
  }
  .win:not(.focused) .win-title { background: var(--w-bar); }

  .win-name {
    flex: 1;
    text-align: center;
    font-size: 12.5px;
    font-weight: 600;
    color: var(--w-ink);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .win:not(.focused) .win-name { color: var(--w-dim); }

  .lights { display: flex; gap: 8px; flex: none; align-items: center; }
  .light {
    width: 12px; height: 12px;
    border-radius: 50%;
    background: var(--tl-off);
    position: relative;
    transition: filter var(--t-1) var(--ease-soft);
  }
  .win.focused .light-close { background: var(--tl-red); }
  .win.focused .light-min   { background: var(--tl-amber); }
  .win.focused .light-zoom  { background: var(--tl-green); }
  .lights:hover .light { filter: brightness(.92); }
  .light::after {
    content: "";
    position: absolute; inset: 0;
    border-radius: 50%;
    box-shadow: inset 0 0 0 .5px rgba(0, 0, 0, .12);
  }

  .win-body {
    flex: 1;
    min-height: 0;
    min-width: 0;
    display: flex;
    flex-direction: column;
    background: var(--bg);
  }

  /* ---- resize handles. Edges reach 3px outside the frame so the
     target is forgiving; corners stack above edges. ---------------- */

  /* The handles sit INSIDE the frame. The window paints with
     containment, so anything hanging outside the border box is clipped
     and a corner drag quietly misses. */
  .win-h { position: absolute; touch-action: none; }
  .win-h-n { left: 12px; right: 12px; top: 0; height: 5px; cursor: ns-resize; }
  .win-h-s { left: 12px; right: 12px; bottom: 0; height: 5px; cursor: ns-resize; }
  .win-h-w { top: 12px; bottom: 12px; left: 0; width: 5px; cursor: ew-resize; }
  .win-h-e { top: 12px; bottom: 12px; right: 0; width: 5px; cursor: ew-resize; }
  .win-h-nw, .win-h-ne, .win-h-sw, .win-h-se {
    width: 18px; height: 18px; z-index: var(--z-raise);
  }
  .win-h-nw { left: 0; top: 0; cursor: nwse-resize; }
  .win-h-se { right: 0; bottom: 0; cursor: nwse-resize; }
  .win-h-ne { right: 0; top: 0; cursor: nesw-resize; }
  .win-h-sw { left: 0; bottom: 0; cursor: nesw-resize; }
  /* The handles stay live while a window fills the desk. Grabbing an
     edge writes the state back to normal on the first frame, so pulling
     a full window in from a corner restores it rather than doing
     nothing, which is what hiding these used to make it do. */

  /* Keyboard move and resize mode says so. */
  .win.kbd-move, .win.kbd-size { outline: 2px dashed var(--accent); outline-offset: 2px; }

  /* ---- minimize. Not a real genie. A scale and a pinch toward the
     dock icon, fast enough to read as one. -------------------------- */

  @keyframes genie-out {
    to { transform: translate(var(--gx), var(--gy)) scale(.06);
         clip-path: inset(0 40% 0 40% round 40px);
         opacity: .1; }
  }
  @keyframes genie-in {
    from { transform: translate(var(--gx), var(--gy)) scale(.06);
           clip-path: inset(0 40% 0 40% round 40px);
           opacity: .1; }
  }
  .win.genie-out { animation: genie-out var(--t-3) var(--ease) forwards; pointer-events: none; }
  .win.genie-in  { animation: genie-in  var(--t-3) var(--ease); }

  /* ---- a floating window that carries the pane or a file ---------- */

  .win-caddy .win-body,
  .win-file .win-body { background: var(--bg); }

  .win-caddy .win-title,
  .win-file .win-title { background: var(--w-qat); }

  /* Over the slot it came from, the floating pane says so and then
     flies home. The shell animates, never the pane node inside it: a
     reparented node has no resting style and would teleport. */
  .win.docking { outline: 2px solid var(--accent); outline-offset: -2px; }
  .win.pane-snap {
    transition: transform 190ms var(--ease), opacity 190ms linear;
    pointer-events: none;
  }
}


/* ================================================================
   src/css/30-green.css
   ================================================================ */
/* =====================================================================
   30-green.css   the threshold.

   Flat field, grain, type. No gradients, no illustration, one graphic
   and it is the flag in the cup. The ball lands as the full stop, and
   then it is the ball that goes in the hole.
   ===================================================================== */

@layer scene {
  /* The stage is a grid of two cells, the panel and the field, and the
     cup lives in the field. That is structural rather than decorative:
     the old build floated the cup over the whole scene on viewport
     percentages, so on a 360 wide phone the flagstick ran straight
     through "FICTIONAL MATTER. NO LOGIN. NOTHING SAVED." and in
     landscape the button was clipped and the fine print sat below the
     fold entirely. Two grid cells cannot overlap, so that class of bug
     is gone rather than tuned.

     Wide: side by side, panel left and field right, which is the
     composition the poster already had. Narrow: stacked, panel above
     and field below. Short: forced side by side, because a stacked
     layout cannot fit a headline and a field in 390 pixels of height. */
  .green {
    position: absolute;
    inset: 0;
    background: var(--green);
    color: var(--panel);
    overflow: hidden;
    z-index: var(--z-green);
    display: grid;
    grid-template-columns: minmax(0, 1fr) clamp(190px, 26%, 420px);
    grid-template-rows: minmax(0, 1fr);
    align-items: center;
    padding: 5vh clamp(24px, 7vw, 130px) calc(5vh + env(safe-area-inset-bottom));
    gap: clamp(12px, 3vw, 48px);
  }
  .green .grain {
    position: absolute;
    inset: 0;
    pointer-events: none;
    mix-blend-mode: overlay;
  }

  .g-panel { position: relative; max-width: 880px; min-width: 0; }

  /* The field owns the cup, and later the ball's play position. */
  .g-field { position: relative; height: 100%; min-width: 0; }

  /* Every responsive override lives at the end of this layer, never
     here. A media query adds no specificity, so a rule written above
     the base declaration loses to it on source order and silently does
     nothing. That is exactly how the landscape headline stayed at 62px
     while a rule three screens up said 32px. */

  /* One hairline, in flag red. The editorial register the campaign
     already uses on its cream layouts. */
  .g-rule {
    display: block;
    width: 44px; height: 1px;
    background: var(--flag-on-dark);
    margin-bottom: 22px;
  }
  .g-lock { display: flex; align-items: baseline; gap: 10px; margin-bottom: clamp(24px, 5vh, 54px); }
  .g-lock .lockmark { align-self: center; }
  .g-word { font-size: 21px; font-weight: 800; letter-spacing: 1.2px; color: #fff; }

  .g-head {
    font-size: clamp(38px, 7.4vw, 96px);
    line-height: 1.02;
    letter-spacing: -.035em;
    font-weight: 800;
  }
  .g-l1, .g-l2 { display: block; }
  .g-l1 { color: rgba(242, 245, 239, .46); }
  .g-l2 { color: #fff; display: flex; align-items: baseline; }

  /* The full stop. The mark's own ball, at rest, and it is never
     hidden. */
  .g-ball {
    display: inline-block;
    width: .34em; height: .34em;
    margin-left: .08em;
    flex: none;
    opacity: 0;
    transform: translateX(-38vw) rotate(-800deg);
  }
  .g-ball svg { width: 100%; height: 100%; }

  /* The entry roll. The rotation is deliberately far short of the truth:
     a real ball at putting speed spins about 13.7 times a second, which
     at 60fps is 82 degrees a frame, past the wagon-wheel limit and into
     mush. Two and a bit turns over the whole roll reads as rolling and
     survives being looked at. Driven by the same curve as the travel so
     the spin stops on the same frame the ball does. */
  .g-ball.landed {
    opacity: 1;
    transform: translateX(0) rotate(0deg);
    transition: transform var(--t-roll) var(--roll), opacity 260ms linear;
  }
  .green.calm .g-ball { opacity: 1; transform: none; transition: none; }

  /* Snap the ball to its resting place with no animation, so a putt
     struck before the entrance finished still starts from the full
     stop. Declared above .rolling, which re-declares its own
     transition and therefore wins once the ball is moving. */
  .g-ball.still { transition: none; }

  .g-sub {
    margin-top: clamp(18px, 3.2vh, 34px);
    max-width: 46ch;
    font-size: clamp(15px, 1.5vw, 19px);
    line-height: 1.55;
    color: rgba(242, 245, 239, .70);
  }

  .green .g-enter {
    margin-top: clamp(24px, 4.4vh, 44px);
    display: inline-flex;
    align-items: center;
    gap: 10px;
    padding: 13px 22px;
    background: var(--panel);
    color: var(--green);
    border-radius: 6px;
    font-size: 15px;
    font-weight: 700;
    letter-spacing: .01em;
    transition: transform var(--t-2) var(--ease), background var(--t-2) var(--ease-soft);
  }
  .green .g-enter:hover { transform: translateY(-2px); background: #fff; }
  .green .g-enter .g { transition: transform var(--t-2) var(--ease); }
  .green .g-enter:hover .g { transform: translateX(3px); }

  .g-fine {
    margin-top: 14px;
    font-size: 11.5px;
    letter-spacing: .06em;
    text-transform: uppercase;
    color: rgba(242, 245, 239, .40);
  }

  /* ---- the cup ---------------------------------------------------- */

  /* Positioned inside the field cell, so it can never reach the panel.
     Held off the very corner because that corner belongs to the M. */
  .g-cup {
    position: absolute;
    right: 0;
    bottom: 12%;
    width: 150px; height: 110px;
    transform-origin: 75px 88px;
  }
  /* The maker's mark, mown into the far corner. Faint on purpose: it
     should be the thing you notice on the second look. */
  .g-mown {
    position: absolute;
    right: clamp(14px, 2.4vw, 40px);
    bottom: calc(clamp(12px, 2.2vh, 34px) + env(safe-area-inset-bottom));
    opacity: .55;
    pointer-events: none;
    line-height: 0;
  }
  .g-mown .mown { display: block; }
  .g-cup svg { position: absolute; left: 0; bottom: 0; }
  .g-shadow {
    position: absolute;
    left: 8px; bottom: 10px;
    width: 134px; height: 30px;
    background: radial-gradient(closest-side, rgba(0, 0, 0, .30), transparent 75%);
  }
  .g-flag {
    position: absolute;
    left: 60px; bottom: 18px;
    width: 72px; height: 110px;
    transform-origin: 14px 90px;
  }
  @keyframes breathe {
    0%, 100% { transform: rotate(0deg); }
    50% { transform: rotate(1.4deg); }
  }
  .g-flag { animation: breathe 4.5s var(--ease-soft) infinite; }

  /* A little, and only a little. The flag leans away from the cursor
     and lifts a hair, then settles. The breathe loop is handed off to a
     transform so the two never fight over the same property. */
  .g-cup { pointer-events: auto; }
  .g-cup:hover .g-flag {
    animation-play-state: paused;
    transform: rotate(-2.5deg) translateY(-2px);
    transition: transform var(--t-2) var(--ease);
  }
  @keyframes shiver {
    0% { transform: rotate(0deg); }
    30% { transform: rotate(-3.2deg); }
    60% { transform: rotate(2deg); }
    100% { transform: rotate(0deg); }
  }
  .g-flag.shiver { animation: shiver 420ms var(--ease-soft); }

  /* ---- the entrance and the putt ----------------------------------- */

  @keyframes rise {
    from { opacity: 0; transform: translateY(16px); }
  }
  .green.in .g-rule { animation: rise 560ms var(--ease) both; }
  .green.in .g-lock { animation: rise 620ms var(--ease) 40ms both; }
  .green.in .g-l1 { animation: rise 700ms var(--ease) 90ms both; }
  .green.in .g-l2 { animation: rise 700ms var(--ease) 180ms both; }
  .green.in .g-sub { animation: rise 700ms var(--ease) 300ms both; }
  .green.in .g-enter { animation: rise 700ms var(--ease) 400ms both; }
  .green.in .g-fine { animation: rise 700ms var(--ease) 480ms both; }
  .green.in .g-cup { animation: rise 900ms var(--ease) 260ms both; }

  .g-panel.hush {
    transition: opacity 420ms var(--ease-soft), transform 620ms var(--ease);
    opacity: .18;
    transform: translateY(-10px);
  }

  /* Position and size are set inline when the ball is lifted out of the
     headline, so this only carries the motion. It shrinks a little on
     the way, because it is rolling away from the reader and because a
     full stop set at ninety-six point is wider than a golf ball has any
     right to be next to the hole. */
  .g-ball.rolling {
    transform: translate(var(--dx), var(--dy)) rotate(1080deg) scale(.76);
    transition: transform 660ms cubic-bezier(.22, .62, .2, 1);
  }
  .g-ball.dropped {
    transform: translate(var(--dx), calc(var(--dy) + 14px)) rotate(1220deg) scale(.30);
    opacity: 0;
    transition: transform 300ms var(--ease-soft), opacity 260ms linear 60ms;
  }

  /* The black of the cup takes the screen. */
  .green.wipe::after {
    content: "";
    position: absolute;
    inset: 0;
    background: radial-gradient(circle at var(--wx) var(--wy), #000 0, #000 100%);
    clip-path: circle(0 at var(--wx) var(--wy));
    animation: cupwipe 700ms var(--ease) forwards;
  }
  @keyframes cupwipe {
    to { clip-path: circle(150% at var(--wx) var(--wy)); }
  }
  .green.wipe { animation: fadeout 200ms linear 620ms forwards; }
  @keyframes fadeout { to { opacity: 0; } }

  @media (prefers-reduced-motion: reduce) {
    .green.in .g-rule, .green.in .g-lock, .green.in .g-l1, .green.in .g-l2,
    .green.in .g-sub, .green.in .g-enter, .green.in .g-fine,
    .green.in .g-cup { animation: none; }
    .g-flag { animation: none; }
    .g-cup:hover .g-flag { transform: none; }
    .green.wipe::after { animation: none; clip-path: circle(150% at 50% 50%); }
  }

  /* ---- the footnote ------------------------------------------------
     Word's own furniture, borrowed on purpose. A footnote separator in
     Word is a SHORT rule held to the left, not a full width one, and
     that is the detail that makes this read as a document rather than
     as a caption. Offset to one side, and on the opposite side from the
     mown M so the two corners each keep something. */
  .g-note {
    position: absolute;
    left: clamp(24px, 7vw, 130px);
    bottom: calc(clamp(14px, 3vh, 40px) + env(safe-area-inset-bottom));
    max-width: min(460px, 62vw);
    pointer-events: none;
  }
  .g-note-rule {
    display: block;
    width: 132px; height: 1px;
    background: rgba(242, 245, 239, .26);
    margin-bottom: 9px;
  }
  .g-note-row { display: flex; align-items: center; gap: 14px; }
  .g-note-t {
    margin: 0;
    font: 12.5px/1.45 var(--doc);
    color: rgba(242, 245, 239, .58);
  }
  /* The pun carries the line, so it gets the emphasis a footnote would
     give a term of art. */
  .g-note-t em {
    font-style: italic;
    color: rgba(242, 245, 239, .92);
  }
  .g-ref {
    font-size: .62em;
    vertical-align: super;
    line-height: 0;
    margin-right: .28em;
    color: rgba(242, 245, 239, .5);
  }
  .g-sub .g-ref { margin: 0 0 0 .12em; }
  .g-note-mark {
    flex: none;
    line-height: 0;
    color: rgba(242, 245, 239, .4);
  }
  .g-note-mark .no-ai { display: block; }

  /* =================================================================
     THE CLEAR. The type gets out of the way for the putt.

     Each line winds up a little against its own direction, then leaves
     accelerating and never decelerates, because something that slows to
     a stop reads as arriving somewhere rather than departing. The
     wind-up eats the first third of the timeline, so the whole visible
     exit is compressed into the last stretch. That compression is the
     crescendo, and it comes from the curve rather than from anything
     bolted on top of it.

     The two directions are deliberately not mirror images. Different
     wind-up distances, different arc signs, staggered starts. Perfect
     symmetry is what makes a split read as a slide transition.

     scaleX with a matching scaleY is doing the job motion blur would
     do. A blur heavy enough to be honest here is around forty pixels,
     it cannot be pointed along an arc, and it is expensive on a phone.
     Stretch is compositor-only and it is the more cartoon answer, which
     is what was asked for.
     ================================================================= */

  @keyframes g-exit-l {
    0% {
      animation-timing-function: cubic-bezier(.25, .46, .45, .94);
      transform: translate3d(0, 0, 0) rotate(0deg) scale(1, 1);
    }
    34% {
      animation-timing-function: cubic-bezier(.3, 0, .8, .15);
      transform: translate3d(4.5vw, -1.1vh, 0) rotate(.9deg) scale(1, 1);
    }
    100% {
      transform: translate3d(-142vw, 3.4vh, 0) rotate(-5deg) scale(1.12, .945);
    }
  }
  @keyframes g-exit-r {
    0% {
      animation-timing-function: cubic-bezier(.22, .5, .5, .95);
      transform: translate3d(0, 0, 0) rotate(0deg) scale(1, 1);
    }
    31% {
      animation-timing-function: cubic-bezier(.3, 0, .8, .15);
      transform: translate3d(-3.8vw, 1.5vh, 0) rotate(-1.2deg) scale(1, 1);
    }
    100% {
      transform: translate3d(142vw, -2.6vh, 0) rotate(4.6deg) scale(1.1, .953);
    }
  }

  .green.clearing .g-l1   { animation: g-exit-l 560ms both; }
  .green.clearing .g-note { animation: g-exit-l 560ms 235ms both; }
  .green.clearing .g-sub  { animation: g-exit-l 560ms 60ms both; }
  .green.clearing .g-fine { animation: g-exit-l 560ms 190ms both; }
  .green.clearing .g-l2   { animation: g-exit-r 560ms 95ms both; }
  .green.clearing .green .g-enter,
  .green.clearing .g-enter { animation: g-exit-r 560ms 150ms both; }

  /* Once they are gone they stay gone and stop catching taps. The
     lockup and its rule are the only type that stays. */
  .green.cleared .g-l1, .green.cleared .g-l2, .green.cleared .g-sub,
  .green.cleared .g-enter, .green.cleared .g-fine, .green.cleared .g-note {
    opacity: 0;
    pointer-events: none;
  }
  .green.cleared .g-panel { pointer-events: none; }

  /* Under calm there is no slide at all. The state machine is the same
     and reaches the same place; only the motion is replaced, because a
     disabled animation that never fires would strand the visitor on the
     poster and turn a motion preference into a locked door. */
  .green.calm.cleared .g-l1, .green.calm.cleared .g-l2,
  .green.calm.cleared .g-sub, .green.calm.cleared .g-enter,
  .green.calm.cleared .g-fine, .green.calm.cleared .g-note { display: none; }

  /* ---- the ball, once it is out of the headline ------------------- */

  .g-ball.free { position: fixed; }
  .green.playing .g-ball.free {
    transform: translate3d(var(--bx, 0), var(--by, 0), 0) scale(var(--bs, 1));
    transition: transform 760ms var(--ease);
  }
  .g-ball.holing {
    transform: translate3d(var(--bx, 0), var(--by, 0), 0) scale(var(--bs, 1));
    transition: transform var(--t-roll) var(--roll);
  }

  /* ---- the camera tilts up the fairway ---------------------------- */

  .g-field { transition: transform 760ms var(--ease); }
  .green.playing .g-field {
    transform: translate(var(--fx, 0), var(--fy, 0)) scale(var(--fs, 1));
  }

  /* =================================================================
     THE PUTT. Furniture the game draws over the field.
     ================================================================= */

  /* touch-action goes on the play surface and nowhere wider. On the
     document it would kill pinch zoom and take 1.4.4 with it. */
  .green.aiming { touch-action: none; -webkit-tap-highlight-color: transparent; }
  .green.aiming, .green.aiming * { -webkit-touch-callout: none; }

  .p-guide {
    position: absolute;
    inset: 0;
    pointer-events: none;
    overflow: visible;
  }

  /* What sells a circle as a ball on grass. It rides under the ball,
     tightens and darkens as the ball slows, and trails while moving. */
  .p-shadow {
    position: fixed;
    left: 0; top: 0;
    border-radius: 50%;
    filter: blur(3px);
    background: #0d2416;
    pointer-events: none;
    transform-origin: 50% 50%;
    will-change: transform;
  }

  .p-putter {
    position: fixed;
    left: 0; top: 0;
    /* The head sits on the anchor point and the rotation pivots there,
       so the club swings about its face rather than about its grip. */
    margin: -8px 0 0 -23px;
    transform-origin: 23px 8px;
    pointer-events: none;
    opacity: 0;
    transition: opacity 320ms var(--ease);
  }
  .green.putter-in .p-putter { opacity: .92; }
  .p-putter .putter { display: block; }
  @keyframes p-swing {
    0%   { filter: none; }
    22%  { filter: brightness(1.35); }
    100% { filter: none; }
  }
  .p-putter.swing { animation: p-swing 220ms var(--ease-soft); }

  .p-hint {
    position: absolute;
    left: 50%;
    bottom: calc(clamp(14px, 4vh, 42px) + env(safe-area-inset-bottom));
    transform: translateX(-50%);
    margin: 0;
    font-size: 12px;
    letter-spacing: .06em;
    text-transform: uppercase;
    color: rgba(242, 245, 239, .52);
    opacity: 0;
    transition: opacity var(--t-3) var(--ease);
    pointer-events: none;
    white-space: nowrap;
  }
  .p-hint.on { opacity: 1; }

  .green .p-offer {
    position: absolute;
    left: 50%;
    bottom: calc(clamp(44px, 10vh, 92px) + env(safe-area-inset-bottom));
    transform: translateX(-50%) translateY(6px);
    padding: 9px 16px;
    font-size: 13px;
    font-weight: 600;
    color: var(--green);
    background: var(--panel);
    border-radius: 6px;
    opacity: 0;
    pointer-events: none;
    transition: opacity var(--t-3) var(--ease), transform var(--t-3) var(--ease);
  }
  .green .p-offer.on {
    opacity: 1;
    pointer-events: auto;
    transform: translateX(-50%) translateY(0);
  }

  /* The ball in play. Position and spin are written every frame by the
     loop; squash is the aiming affordance only. */
  .green.playing .g-ball.free {
    transform:
      translate3d(var(--bx, 0), var(--by, 0), 0)
      scale(var(--bs, 1))
      rotate(var(--spin, 0deg))
      scaleX(var(--squash, 1));
    transition: transform 760ms var(--ease);
  }
  .green.aiming .g-ball.free,
  .green.rolling .g-ball.free { transition: none; }

  /* =================================================================
     IT DROPS, AND THEN THE CAMERA GOES IN AFTER IT.
     ================================================================= */

  /* Rim first. The ball shrinks into the cup and sinks below its own
     lip rather than fading on the spot, which is what a hole does to a
     ball and what a plain fade does not. */
  @keyframes p-drop {
    0% {
      transform: translate3d(var(--bx, 0), var(--by, 0), 0) scale(var(--bs, 1));
      opacity: 1;
    }
    45% {
      transform: translate3d(var(--bx, 0), calc(var(--by, 0px) + 5px), 0)
                 scale(calc(var(--bs, 1) * .74));
      opacity: 1;
    }
    100% {
      transform: translate3d(var(--bx, 0), calc(var(--by, 0px) + 13px), 0)
                 scale(calc(var(--bs, 1) * .18));
      opacity: 0;
    }
  }
  .green .g-ball.dropping {
    animation: p-drop 190ms cubic-bezier(.4, 0, 1, 1) both;
    transition: none;
  }

  /* The fall. The iris closes on the hole at about seventy percent of
     the scale's duration, because the aperture shutting ahead of the
     zoom is the whole difference between falling down a shaft and
     zooming at a wall. The scale is cut off mid-acceleration and never
     allowed to settle, for the same reason. */
  /* The fall is driven frame by frame in 70-green.js, not by keyframes.
     A CSS timing function applies to each keyframe segment separately,
     so an intermediate stop restarts the curve from zero velocity and
     the move visibly stalls in the middle. One loop, one continuous
     function, and the aperture on the same clock as the scale. */
  .green.falling { will-change: transform; }

  /* The iris is a SIBLING of the scene, not a child of it. As a child
     it would ride the fall's own scale and open as fast as the zoom
     closed. It is a circle of nothing with black shadowed out to every
     edge, so shrinking it shuts the world down to a point on the hole. */
  .g-iris {
    position: fixed;
    width: 240px; height: 240px;
    margin: -120px 0 0 -120px;
    border-radius: 50%;
    box-shadow: 0 0 0 9999px #000;
    pointer-events: none;
    z-index: var(--z-live);
    transform: scale(22);
  }

  /* The last of the light goes out under the black, so the desk is
     never revealed by the green simply vanishing. */
  .green.falling .g-lock, .green.falling .g-mown, .green.falling .g-note,
  .green.falling .p-hint, .green.falling .p-putter {
    opacity: 0;
    transition: opacity 200ms linear;
  }

  .green .p-sound {
    position: absolute;
    right: calc(clamp(14px, 2.4vw, 40px) + env(safe-area-inset-right));
    top: calc(clamp(14px, 2.4vh, 34px) + env(safe-area-inset-top));
    width: 34px; height: 34px;
    display: grid;
    place-items: center;
    border-radius: 50%;
    color: rgba(242, 245, 239, .42);
    background: transparent;
    transition: color var(--t-2) var(--ease), background var(--t-2) var(--ease);
  }
  .green .p-sound:hover { color: rgba(242, 245, 239, .85); background: rgba(255, 255, 255, .07); }
  .green .p-sound.on { color: var(--flag-on-dark); }

  /* =================================================================
     RESPONSIVE. Everything that overrides a base rule above lives
     here, at the bottom of the layer, because a media query carries no
     extra specificity and would otherwise lose on source order.
     ================================================================= */

  /* Stacked, for a phone held upright. The field becomes a band across
     the bottom and the cup sits left of centre, so the mown M keeps the
     corner to itself. */
  @media (max-width: 760px) {
    .green {
      grid-template-columns: minmax(0, 1fr);
      grid-template-rows: minmax(0, 1fr) clamp(150px, 24vh, 250px);
      align-items: end;
      gap: 0;
    }
    .g-panel { align-self: center; }
    .g-cup { right: auto; left: 2%; bottom: 4px; }
    /* Stacked, the bottom of the screen belongs to the cup, so the
       footnote sits just above the field band instead of in it. That is
       also where a footnote belongs: under its own block of text. */
    .g-note {
      max-width: 78vw;
      bottom: calc(clamp(150px, 24vh, 250px) + 14px + env(safe-area-inset-bottom));
    }
  }

  @media (max-width: 400px) {
    .g-cup { transform: scale(.84); transform-origin: left bottom; }
    .g-mown { transform: scale(.74); transform-origin: right bottom; }
  }

  /* Short. A landscape phone is 390 tall and the poster has to give.
     The headline gives the most: at the base size it wraps to three
     lines here and pushes the fine print clean off the bottom. */
  @media (max-height: 560px) {
    .green {
      grid-template-columns: minmax(0, 1fr) clamp(120px, 18%, 210px);
      grid-template-rows: minmax(0, 1fr);
      align-items: center;
      padding: 3vh clamp(18px, 3.4vw, 56px) calc(3vh + env(safe-area-inset-bottom));
      gap: clamp(8px, 2vw, 22px);
    }
    .g-panel { align-self: center; }
    .g-head { font-size: clamp(20px, 3.05vw, 30px); }
    .g-lock { margin-bottom: 7px; }
    .g-word { font-size: 16px; }
    .g-rule { margin-bottom: 9px; width: 30px; }
    .g-sub { margin-top: 7px; font-size: 12px; max-width: 52ch; line-height: 1.4; }
    .green .g-enter { margin-top: 10px; padding: 8px 14px; font-size: 13px; }
    .g-fine { margin-top: 6px; font-size: 9.5px; }
    /* Up off the corner. This column is only about 150px wide and the
       corner belongs to the M. */
    .g-cup { bottom: 34%; left: auto; right: 0; transform: scale(.66); transform-origin: right bottom; }
    .g-mown { transform: scale(.66); transform-origin: right bottom; }
    .g-note { left: clamp(18px, 3.4vw, 56px); bottom: 8px; max-width: 54vw; }
    .g-note-rule { width: 92px; margin-bottom: 6px; }
    .g-note-t { font-size: 11px; }
    .g-note-row { gap: 10px; }
    .g-note-mark .no-ai { width: 22px; height: 22px; }
  }
}


/* ================================================================
   src/css/40-desk.css
   ================================================================ */
/* =====================================================================
   40-desk.css   the desk.

   The wallpaper is the threshold's own green, thrown out of focus, so
   the scene the visitor just walked through is still under the work.
   Flat fields and one soft light, no photograph, nothing to load.
   ===================================================================== */

@layer scene {
  #stage {
    background:
      radial-gradient(120% 90% at 22% 8%, rgba(58, 108, 74, .55) 0%, rgba(11, 20, 16, 0) 60%),
      radial-gradient(90% 70% at 88% 96%, rgba(36, 70, 51, .55) 0%, rgba(11, 20, 16, 0) 62%),
      linear-gradient(178deg, var(--desk-1) 0%, var(--desk-0) 72%);
  }
  #stage::after {
    /* one hairline of dusk on the horizon */
    content: "";
    position: absolute;
    left: 0; right: 0; top: 46%;
    height: 1px;
    background: linear-gradient(90deg, transparent, rgba(226, 114, 90, .16) 35%, transparent);
    pointer-events: none;
  }

  /* ---- menu bar ------------------------------------------------------- */

  .menubar {
    position: absolute;
    left: 0; right: 0; top: 0;
    height: var(--menubar-h);
    display: flex;
    align-items: center;
    gap: 2px;
    padding: 0 10px;
    background: rgba(16, 26, 21, .62);
    backdrop-filter: saturate(160%) blur(18px);
    -webkit-backdrop-filter: saturate(160%) blur(18px);
    color: rgba(233, 239, 232, .92);
    font-size: 12.5px;
    z-index: var(--z-menubar);
    border-bottom: 1px solid rgba(255, 255, 255, .06);
  }
  .mb-mark { display: grid; place-items: center; width: 22px; opacity: .9; }
  .mb-app, .mb-item {
    padding: 1px 8px;
    border-radius: 4px;
    color: inherit;
    font-size: 12.5px;
    line-height: 18px;
  }
  .mb-app { font-weight: 700; }
  .mb-app:hover, .mb-item:hover, .mb-app.open, .mb-item.open {
    background: rgba(255, 255, 255, .16);
  }
  .mb-gap { flex: 1; }
  .mb-ic { display: grid; place-items: center; width: 22px; opacity: .8; }
  .mb-clock { font-size: 12.5px; padding-left: 6px; font-variant-numeric: tabular-nums; }

  .mb-menu {
    position: absolute;
    min-width: 208px;
    padding: 5px;
    background: rgba(244, 246, 242, .96);
    backdrop-filter: blur(22px);
    -webkit-backdrop-filter: blur(22px);
    border: 1px solid rgba(0, 0, 0, .10);
    border-radius: 8px;
    box-shadow: var(--lift-2);
    z-index: var(--z-menubar);
    color: var(--ink);
  }
  .mb-row {
    display: block;
    width: 100%;
    text-align: left;
    padding: 4px 10px;
    border-radius: 5px;
    font-size: 13px;
    color: var(--ink);
  }
  .mb-row:hover { background: var(--green); color: #fff; }
  .mb-row.inert { opacity: .40; }
  .mb-row.inert:hover { background: transparent; color: var(--ink); }
  .mb-sep { display: block; height: 1px; margin: 4px 8px; background: rgba(0, 0, 0, .12); }

  /* ---- dock ------------------------------------------------------------- */

  .dock {
    position: absolute;
    left: 50%;
    bottom: 8px;
    transform: translateX(-50%);
    display: flex;
    align-items: flex-end;
    gap: 6px;
    padding: 6px 8px;
    height: var(--dock-h);
    background: rgba(22, 34, 28, .48);
    backdrop-filter: blur(22px) saturate(150%);
    -webkit-backdrop-filter: blur(22px) saturate(150%);
    border: 1px solid rgba(255, 255, 255, .10);
    border-radius: 18px;
    z-index: var(--z-dock);
  }
  .dock-app {
    position: relative;
    width: 52px; height: 52px;
    transform: scale(var(--mag, 1));
    transform-origin: bottom center;
    transition: transform 90ms linear;
  }
  .dock-app svg { width: 52px; height: 52px; }
  .dock-app.greyed { filter: saturate(.15) brightness(.9); }
  .dock-app.trash { margin-left: 8px; }
  .dock-app .dot {
    position: absolute;
    left: 50%; bottom: -5px;
    width: 4px; height: 4px;
    margin-left: -2px;
    border-radius: 50%;
    background: rgba(255, 255, 255, .8);
  }
  .dock-app::after {
    content: attr(title);
    position: absolute;
    left: 50%; bottom: calc(100% + 10px);
    transform: translateX(-50%);
    padding: 3px 8px;
    background: rgba(20, 30, 24, .92);
    color: #fff;
    font-size: 11.5px;
    border-radius: 5px;
    white-space: nowrap;
    opacity: 0;
    pointer-events: none;
    transition: opacity var(--t-1) var(--ease-soft);
  }
  .dock-app:hover::after { opacity: 1; }

  @keyframes bounce {
    0%, 100% { transform: scale(var(--mag, 1)) translateY(0); }
    45% { transform: scale(var(--mag, 1)) translateY(-16px); }
  }
  .dock-app.bounce { animation: bounce 340ms var(--ease) 2; }

  /* ---- where minimized windows wait ---------------------------------

     A window that goes off screen has to have somewhere visible to be,
     or minimizing it is a trapdoor. The divider is the same one a real
     dock draws between the apps and the windows. */
  .dock-min {
    display: flex;
    align-items: flex-end;
    gap: 6px;
    margin-left: 10px;
    padding-left: 10px;
    border-left: 1px solid rgba(255, 255, 255, .18);
  }
  .dock-min-app {
    position: relative;
    width: 38px; height: 38px;
    display: grid; place-items: center;
    margin-bottom: 6px;
    border-radius: 9px;
    background: rgba(255, 255, 255, .09);
    cursor: pointer;
    transition: background var(--t-1) var(--ease-soft), transform var(--t-1) var(--ease-soft);
  }
  .dock-min-app:hover { background: rgba(255, 255, 255, .18); transform: translateY(-3px); }
  .dock-min-app svg { width: 26px; height: 26px; }
  .dock-min-app::after {
    content: attr(title);
    position: absolute;
    left: 50%; bottom: calc(100% + 10px);
    transform: translateX(-50%);
    padding: 3px 8px;
    background: rgba(20, 30, 24, .92);
    color: #fff;
    font-size: 11.5px;
    border-radius: 5px;
    white-space: nowrap;
    opacity: 0;
    pointer-events: none;
    transition: opacity var(--t-1) var(--ease-soft);
  }
  .dock-min-app:hover::after { opacity: 1; }

  /* ---- Finder ------------------------------------------------------------- */

  .win-finder .win-body { flex-direction: row; background: #fff; }
  .fnd { display: flex; flex: 1; min-height: 0; }
  .fnd-side {
    flex: none;
    width: 168px;
    background: #f0f0ee;
    border-right: 1px solid var(--w-line);
    padding: 8px 0;
    overflow: auto;
  }
  .fnd-shead {
    font-size: 10.5px; font-weight: 700; text-transform: uppercase;
    letter-spacing: .08em; color: #90918c;
    padding: 8px 12px 4px;
  }
  .fnd-srow {
    display: flex; align-items: center; gap: 7px;
    padding: 4px 12px;
    font-size: 12.5px; color: var(--w-ink);
  }
  .fnd-srow.on { background: rgba(0, 0, 0, .07); border-radius: 5px; margin: 0 6px; }
  .fnd-srow .g { color: #6b90c9; }

  .fnd-main { flex: 1; min-width: 0; display: flex; flex-direction: column; }
  .fnd-list { flex: 1; overflow: auto; padding: 4px 0; }
  .fnd-row {
    display: flex; align-items: center; gap: 8px;
    padding: 4px 12px;
    font-size: 12.5px;
    color: var(--w-ink);
  }
  .fnd-row:hover { background: #f2f4f7; }
  .fnd-row.sel { background: #d6e6fb; }
  .fnd-row.doc .g { color: #3a7bd5; }
  .fnd-row .g { color: #6b90c9; flex: none; }
  .fnd-name { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .fnd-meta { flex: none; font-size: 11px; color: var(--w-dim); }
  .fnd-path {
    flex: none;
    display: flex; align-items: center; gap: 4px;
    height: 24px;
    padding: 0 10px;
    background: #f6f6f4;
    border-top: 1px solid var(--w-line);
    font-size: 11px;
    color: var(--w-dim);
  }
  .fnd-seg { white-space: nowrap; }
  .fnd-path .g { flex: none; }

  /* ---- the caddy's read --------------------------------------------------- */

  .guide {
    position: absolute;
    left: 22px;
    bottom: calc(var(--dock-h) + 22px);
    max-width: 330px;
    display: flex;
    align-items: flex-start;
    gap: 10px;
    padding: 11px 14px 11px 12px;
    background: rgba(14, 24, 18, .90);
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    border-radius: 8px;
    border-left: 2px solid var(--flag-on-dark);
    box-shadow: var(--lift-2);
    color: #eef2ea;
    z-index: var(--z-guide);
  }
  /* The UI face, not the display serif. A caddy talks; he does not
     read you a poem. Italic serif at this size, light on dark, is the
     hardest thing on the page to take in at a glance, and the plate has
     about one second to be taken in. The display face keeps the one job
     it is good at, the About headline. */
  .guide .mark { flex: none; margin-top: 1px; }
  .guide-say { flex: 1; min-width: 0; }
  .guide-lead {
    display: block;
    font-size: 11.5px;
    font-weight: 700;
    letter-spacing: .06em;
    text-transform: uppercase;
    color: var(--flag-on-dark);
    margin-bottom: 2px;
  }
  .guide p {
    font-size: 13.5px;
    font-weight: 450;
    line-height: 1.42;
    color: #eef2ea;
  }
  .guide button {
    flex: none;
    width: 20px; height: 20px;
    display: grid; place-items: center;
    color: rgba(238, 242, 234, .55);
    border-radius: 4px;
  }
  .guide button:hover { color: #fff; background: rgba(255, 255, 255, .12); }
  @keyframes guide-in {
    from { opacity: 0; transform: translateY(8px); }
  }
  .guide { animation: guide-in var(--t-3) var(--ease); }

  /* ---- the line that traces the next control ------------------------

     The pointer at the next move, and the reason most of the script has
     no words. It draws itself around the control twice and then holds
     as a thin ring until something is clicked. The ring it replaced
     pulsed forever, which is the one thing an attention cue must never
     do: a cue that never stops stops being a cue. */

  @keyframes trace {
    0%   { stroke-dashoffset: 100; }
    55%  { stroke-dashoffset: 0; }
    100% { stroke-dashoffset: -100; }
  }
  .trace {
    position: fixed;
    pointer-events: none;
    z-index: var(--z-guide);
  }
  .trace svg { display: block; overflow: visible; }
  .trace rect {
    fill: none;
    stroke: var(--accent);
    stroke-width: 2.5;
    stroke-linecap: butt;
    stroke-dasharray: 100;
    stroke-dashoffset: 100;
    animation: trace 900ms cubic-bezier(.4, 0, .2, 1) 2 forwards;
  }
  .trace.hold rect { animation: none; stroke-dashoffset: 0; opacity: .5; }

  /* ---- the about card ------------------------------------------------------- */

  .scrim {
    position: absolute;
    inset: 0;
    background: rgba(6, 12, 9, .58);
    backdrop-filter: blur(3px);
    -webkit-backdrop-filter: blur(3px);
    z-index: var(--z-scrim);
    display: grid;
    place-items: center;
  }
  .about {
    width: min(560px, 88vw);
    max-height: 80vh;
    overflow: auto;
    background: var(--panel);
    color: var(--ink);
    border-radius: 10px;
    padding: 34px 38px 30px;
    box-shadow: var(--lift-3);
    z-index: var(--z-modal);
  }
  .about .lock { display: flex; align-items: center; gap: 10px; margin-bottom: 20px; }
  .about h2 {
    font-family: var(--display);
    font-size: 26px;
    line-height: 1.2;
    margin-bottom: 14px;
  }
  .about p { font-size: 13.5px; line-height: 1.6; margin-bottom: 10px; }
  .about .rule { height: 1px; background: var(--accent); width: 44px; margin: 18px 0; }
  .about .fine { font-size: 11.5px; color: var(--muted); line-height: 1.55; }
  .about .close {
    margin-top: 20px;
    padding: 8px 16px;
    background: var(--green);
    color: #fff;
    border-radius: var(--r);
    font-size: 13px;
  }
  .about .close:hover { background: var(--green-soft); }

  /* ---- narrow: the desk gets out of the way ---------------------------------- */

  @media (max-width: 820px) {
    .dock, .menubar { display: none; }
    #desk-windows { top: 0; }
    .guide { bottom: 18px; left: 12px; right: 12px; max-width: none; }
  }
}


/* ================================================================
   src/css/50-word.css
   ================================================================ */
/* =====================================================================
   50-word.css   the chrome.

   Proportions come from the 2026-08-12 screen recording of the real
   add-in running in Word for Mac: the AutoSave row above the tabs, the
   tab strip with Comments, Editing and Share pushed right, a ribbon
   about sixty pixels tall with the styles gallery in it, the ruler,
   the grey canvas, and a status bar that is mostly text.
   ===================================================================== */

@layer chrome {
  /* The ribbon collapses against the WINDOW, not the viewport, because
     the window is no longer viewport sized. Container queries do that
     with no script and they work from file://. */
  .win-word { container: word / inline-size; }
  .win-word .win-body { background: var(--w-bar); }

  /* ---- title row -------------------------------------------------- */

  .wd-qat {
    flex: 1;
    display: flex;
    align-items: center;
    gap: 2px;
    min-width: 0;
    height: 28px;
  }

  .autosave {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 2px 6px;
    border-radius: var(--r);
    color: var(--w-ink);
    font-size: 11.5px;
    white-space: nowrap;
  }
  .autosave:hover { background: var(--w-hover); }
  .as-pill {
    width: 26px; height: 14px;
    border-radius: 8px;
    background: #b9b9b3;
    position: relative;
    transition: background var(--t-1) var(--ease-soft);
  }
  .as-knob {
    position: absolute;
    top: 2px; left: 2px;
    width: 10px; height: 10px;
    border-radius: 50%;
    background: #fff;
    transition: transform var(--t-1) var(--ease);
  }
  .autosave.on .as-pill { background: var(--w-blue); }
  .autosave.on .as-knob { transform: translateX(12px); }

  .wd-qat .rb-ico {
    width: 24px; height: 22px;
    display: grid; place-items: center;
    border-radius: 3px;
    color: var(--w-ink);
  }
  .wd-qat .rb-ico:hover { background: var(--w-hover); }

  .wd-title {
    flex: 1;
    display: flex;
    align-items: baseline;
    justify-content: center;
    gap: 5px;
    min-width: 0;
    font-size: 12.5px;
    white-space: nowrap;
    overflow: hidden;
  }
  .wd-docname { font-weight: 600; color: var(--w-ink); text-overflow: ellipsis; overflow: hidden; }
  .wd-compat { color: var(--w-dim); font-size: 11.5px; }

  .wd-search {
    display: flex;
    align-items: center;
    gap: 5px;
    padding: 2px 8px;
    border-radius: 4px;
    color: var(--w-dim);
    font-size: 11.5px;
    white-space: nowrap;
  }
  .wd-search:hover { background: var(--w-hover); color: var(--w-ink); }

  /* ---- tab strip --------------------------------------------------- */

  .wd-tabs {
    flex: none;
    display: flex;
    align-items: stretch;
    gap: 2px;
    padding: 0 8px;
    height: 26px;
    background: var(--w-bar);
    border-bottom: 1px solid var(--w-line-2);
  }
  .rtab {
    padding: 0 9px;
    font-size: 12.5px;
    color: var(--w-ink);
    border-bottom: 2px solid transparent;
    white-space: nowrap;
  }
  .rtab:hover { background: var(--w-hover); }
  .rtab.on { color: var(--w-blue); border-bottom-color: var(--w-blue); font-weight: 600; }

  .wd-chips { margin-left: auto; display: flex; align-items: center; gap: 6px; }
  .wchip {
    display: flex; align-items: center; gap: 4px;
    padding: 2px 8px;
    height: 20px;
    font-size: 11.5px;
    border: 1px solid var(--w-line);
    border-radius: 4px;
    background: #fff;
    color: var(--w-ink);
    white-space: nowrap;
  }
  .wchip:hover { background: var(--w-hover); }
  .wchip.share { background: var(--w-blue); border-color: var(--w-blue); color: #fff; }
  .wchip.share:hover { filter: brightness(1.06); }

  /* ---- ribbon ------------------------------------------------------- */

  .wd-ribbon {
    flex: none;
    display: flex;
    align-items: stretch;
    gap: 0;
    height: 66px;
    padding: 4px 8px;
    background: var(--w-ribbon);
    border-bottom: 1px solid var(--w-line);
    overflow: hidden;
  }
  /* Every group holds its size except the styles gallery, which is the
     one that gives ground as the window narrows. That keeps the Caddy
     button on screen at the far right, which is where the whole demo
     points. */
  .rgroup { display: flex; align-items: center; padding: 0 6px; flex: none; }
  .rgroup-styles { flex: 0 1 auto; min-width: 0; overflow: hidden; }
  .rgrow { display: flex; align-items: center; gap: 2px; }
  .rb-col { display: flex; flex-direction: column; gap: 1px; }
  .rb-col2 { display: flex; flex-direction: column; gap: 2px; }
  .rsep { width: 1px; align-self: stretch; margin: 6px 5px; background: var(--w-line-2); }

  .rb {
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 3px;
    color: var(--w-ink);
    transition: background var(--t-1) var(--ease-soft);
  }
  .rb:hover { background: var(--w-hover); }
  .rb:active { background: var(--w-press); }
  .rb.on { background: #d9e5f6; box-shadow: inset 0 0 0 1px #b6cdea; }

  .rb-ico { width: 24px; height: 22px; }
  .rb-big {
    flex-direction: column;
    gap: 2px;
    width: 54px;
    height: 56px;
    padding: 4px 2px;
    font-size: 10px;
    line-height: 1.1;
    text-align: center;
  }
  .rb-cap { color: var(--w-ink); overflow: hidden; text-overflow: ellipsis; width: 100%; }
  .rb-stack { display: flex; }

  .rb-l { font-size: 13px; font-family: var(--doc); line-height: 1; }
  .rb-l.b { font-weight: 700; }
  .rb-l.i { font-style: italic; }
  .rb-l.u { text-decoration: underline; }
  .rb-l.s { text-decoration: line-through; }
  .rb-l.red { color: #c0392b; border-bottom: 3px solid #c0392b; }
  .rb-l.hl { background: #ffe58a; border-bottom: 3px solid #e0a800; }

  .wcombo {
    height: 20px;
    border: 1px solid var(--w-line);
    border-radius: 3px;
    background: #fff;
    font-size: 11.5px;
    padding: 0 2px 0 4px;
    color: var(--w-ink);
  }
  .wcombo.font { width: 96px; }
  .wcombo.size { width: 46px; }

  .styles { display: flex; align-items: center; gap: 3px; min-width: 0; overflow: hidden; }
  .style-card {
    width: 62px; height: 46px;
    border: 1px solid var(--w-line);
    border-radius: 3px;
    background: #fff;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    gap: 1px;
    overflow: hidden;
  }
  .style-card:hover { border-color: #9fb4cf; }
  .style-card.on { border-color: var(--w-blue); box-shadow: inset 0 0 0 1px var(--w-blue); }
  .sc-sample { font-family: var(--doc); font-size: 11px; color: #1f1f1d; white-space: nowrap; }
  .sc-name { font-size: 8.5px; color: var(--w-dim); white-space: nowrap; }
  .style-card.def .sc-sample { font-weight: 700; text-decoration: underline; font-size: 10px; }
  .style-card.h .sc-sample { color: var(--w-blue); }
  .style-more {
    width: 14px; height: 46px;
    display: grid; place-items: center;
    color: var(--w-dim);
    border: 1px solid var(--w-line);
    border-radius: 3px;
    background: #fff;
  }

  .rgroup-addins { margin-left: auto; flex: none; }
  .rb-big.caddy .mark { margin-bottom: 1px; }
  .rb-big.caddy .rb-cap { font-weight: 600; }
  .rb-big.caddy.on { background: #e3ece4; box-shadow: inset 0 0 0 1px var(--green); }

  /* Inert controls look inert. They are still reachable, they still
     say what they would do, and they never pretend. */
  .inert { opacity: .42; cursor: default; }
  .inert:hover { background: transparent; }
  .rb.inert:active { background: transparent; }
  @keyframes nudge {
    0%, 100% { transform: translateX(0); }
    25% { transform: translateX(-2px); }
    75% { transform: translateX(2px); }
  }
  .inert-nudge { animation: nudge 180ms var(--ease-soft); }
  .dim { opacity: .38; }

  /* ---- ruler --------------------------------------------------------- */

  .wd-ruler {
    flex: none;
    height: 18px;
    background: var(--w-bar);
    border-bottom: 1px solid var(--w-line-2);
    display: flex;
    justify-content: center;
    align-items: center;
  }
  .ruler-in {
    position: relative;
    width: calc(var(--sheet-w) * var(--doc-zoom));
    max-width: calc(100% - 24px);
    height: 12px;
    background: #fff;
    border: 1px solid var(--w-line);
    border-radius: 1px;
    overflow: hidden;
  }
  .ruler-in .tick {
    position: absolute; top: 3px;
    width: 1px; height: 6px;
    background: #b4b4ae;
    transform: translateX(-.5px);
  }
  .ruler-in .tick.edge { background: #7d7d77; height: 8px; top: 2px; }
  /* The one inch margin at each end, the way Word shades it. */
  .ruler-in .margin {
    position: absolute; top: 0; bottom: 0;
    width: 11.8%;
    background: #e6e6e2;
  }
  .ruler-in .margin.left { left: 0; border-right: 1px solid #cfcfc9; }
  .ruler-in .margin.right { right: 0; border-left: 1px solid #cfcfc9; }

  /* ---- workspace ------------------------------------------------------ */

  .wd-work {
    flex: 1;
    min-height: 0;
    display: flex;
    position: relative;
  }
  .doc-col {
    flex: 1;
    min-width: 0;
    display: flex;
    flex-direction: column;
  }

  .nav-rail {
    flex: none;
    width: 210px;
    border-right: 1px solid var(--w-line);
    background: #fff;
    overflow: auto;
    padding: 8px 0;
  }
  .nav-h {
    font-size: 11px; font-weight: 600; text-transform: uppercase;
    letter-spacing: .1em; color: var(--muted); padding: 0 12px 6px;
  }
  .nav-row {
    display: block; width: 100%; text-align: left;
    padding: 5px 12px; font-size: 12px; color: var(--ink);
    border-left: 2px solid transparent;
  }
  .nav-row:hover { background: var(--panel); border-left-color: var(--accent); }
  .nav-row.sub { padding-left: 24px; color: var(--muted); font-size: 11.5px; }
  .nav-empty { padding: 8px 12px; font-size: 12px; color: var(--muted); }

  .cmt-rail {
    flex: none;
    width: 232px;
    border-left: 1px solid var(--w-line);
    background: #f7f7f5;
    overflow: auto;
    padding: 10px;
  }
  .cmt {
    background: #fff;
    border: 1px solid var(--w-line);
    border-radius: var(--r);
    padding: 8px;
    margin-bottom: 8px;
    cursor: pointer;
  }
  .cmt:hover { border-color: var(--green-soft); }
  .cmt-head { display: flex; align-items: baseline; gap: 6px; margin-bottom: 4px; }
  .cmt-who { font-size: 11.5px; font-weight: 600; color: var(--ink); }
  .cmt-when { font-size: 10.5px; color: var(--muted); flex: 1; }
  .cmt-x { color: var(--muted); }
  .cmt-x:hover { color: var(--danger); }
  .cmt-text {
    width: 100%; resize: vertical;
    border: 0; font: 12px/1.45 var(--sans); color: var(--ink);
    background: transparent;
  }
  .cmt-text:focus { outline: none; }
  .cmt-empty { font-size: 12px; color: var(--muted); }

  /* ---- find bar --------------------------------------------------------- */

  .find-bar {
    position: absolute;
    top: 10px; right: 18px;
    display: flex; align-items: center; gap: 6px;
    padding: 5px 8px;
    background: #fff;
    border: 1px solid var(--w-line);
    border-radius: var(--r);
    box-shadow: var(--lift-1);
    z-index: var(--z-overlay);
    color: var(--w-dim);
  }
  .find-in {
    width: 180px; font-size: 12.5px; color: var(--w-ink);
    border: 0; outline: none;
  }
  .find-count { font-size: 11px; color: var(--w-dim); min-width: 62px; }
  .find-nav, .find-close {
    width: 22px; height: 22px; display: grid; place-items: center;
    border-radius: 3px; color: var(--w-dim);
  }
  .find-nav:hover, .find-close:hover { background: var(--w-hover); color: var(--w-ink); }

  /* ---- status bar --------------------------------------------------------- */

  .wd-status {
    flex: none;
    display: flex;
    align-items: center;
    gap: 14px;
    height: 22px;
    padding: 0 10px;
    background: var(--w-bar);
    border-top: 1px solid var(--w-line);
    font-size: 11px;
    color: var(--w-dim);
    white-space: nowrap;
    overflow: hidden;
  }
  .sb-gap { flex: 1; }
  .sb-btn {
    display: flex; align-items: center; gap: 4px;
    padding: 1px 5px; border-radius: 3px; color: var(--w-dim);
  }
  .sb-btn:hover { background: var(--w-hover); color: var(--w-ink); }
  .sb-btn.on { color: var(--w-blue); }
  .sb-range { width: 92px; accent-color: var(--w-dim); }
  .sb-pct { min-width: 40px; text-align: right; font-variant-numeric: tabular-nums; }

  /* ---- focus mode --------------------------------------------------------- */

  .win-word.focus-mode .wd-tabs,
  .win-word.focus-mode .wd-ribbon,
  .win-word.focus-mode .wd-ruler { display: none; }

  /* ---- narrow: the ribbon drops its widest groups, then the pane
     stops docking and starts overlaying. ------------------------------- */

  @container word (max-width: 1320px) {
    .rgroup-addins .rb-big:nth-child(-n + 3) { display: none; }
  }
  @container word (max-width: 1140px) {
    .rgroup-addins .rb-big:not(.caddy) { display: none; }
  }
  @container word (max-width: 980px) {
    .styles .style-card:nth-child(n + 4) { display: none; }
  }
  @container word (max-width: 760px) {
    .wd-chips .wchip span { display: none; }
  }
}


/* ================================================================
   src/css/60-paper.css
   ================================================================ */
/* =====================================================================
   60-paper.css   the document.

   Geometry is a scaled Letter page. 8.5 x 11 at 96dpi is 816 x 1056;
   this draws at 660 wide, a factor of 0.809, so a one inch margin is
   78px and the text block is 9 inches, or 698px, tall. Twelve point
   Times lands at 13px at that factor, and double spacing is what a
   Kentucky filing actually uses.

   The zoom is a transform on the whole host, never a font size, so
   line breaking cannot change with it and the document never
   repaginates because a window got narrower.
   ===================================================================== */

@layer doc {
  #doc-canvas {
    flex: 1;
    min-width: 0;
    overflow: auto;
    background: var(--w-canvas);
    padding: 16px 0 60px;
    display: flex;
    justify-content: center;
    align-items: flex-start;
  }

  #doc-scale { position: relative; flex: none; }

  #doc-pages {
    width: var(--sheet-w);
    transform: scale(var(--doc-zoom));
    transform-origin: 0 0;
    outline: none;
    caret-color: var(--w-ink);
  }
  #doc-pages ::selection { background: var(--w-sel); }

  .sheet {
    width: var(--sheet-w);
    height: var(--sheet-h, 854px);
    margin: 0 auto 16px;
    background: #fff;
    box-shadow: 0 0 0 1px rgba(31, 31, 29, .10), 0 2px 6px rgba(31, 31, 29, .16);
    position: relative;
  }
  /* A column, so a footnote can sit at the foot of the page it belongs
     to rather than in the middle of the prose that called it. */
  .page-body {
    height: var(--body-h, 698px);
    margin: var(--pad, 78px);
    overflow: hidden;
    font: 13px/2 var(--doc);
    color: #000;
    display: flex;
    flex-direction: column;
    align-items: stretch;
  }
  .page-body > .p { flex: none; }

  /* ---- page setup. Every one of these is a live control. ---------- */

  .with-header .sheet::before {
    content: var(--header-text, "");
    position: absolute;
    left: var(--pad, 78px); right: var(--pad, 78px);
    top: calc(var(--pad, 78px) / 2.6);
    font: 11px var(--doc);
    color: #444;
    text-align: center;
    border-bottom: .5px solid #b9b9b3;
    padding-bottom: 2px;
  }
  .with-footer .sheet::after {
    content: var(--footer-text, "");
    position: absolute;
    left: var(--pad, 78px); right: var(--pad, 78px);
    bottom: calc(var(--pad, 78px) / 2.6);
    font: 11px var(--doc);
    color: #444;
    text-align: center;
    border-top: .5px solid #b9b9b3;
    padding-top: 2px;
  }
  .with-pagenum .sheet::after { content: "Page " attr(data-page); }

  .watermarked .page-body { position: relative; }
  .watermarked .sheet .page-body::before {
    content: "DRAFT";
    position: absolute;
    inset: 0;
    display: grid;
    place-items: center;
    font: 700 96px var(--sans);
    letter-spacing: .12em;
    color: rgba(31, 31, 29, .07);
    transform: rotate(-32deg);
    pointer-events: none;
    z-index: var(--z-base);
  }

  /* Pleading line numbers, down the left margin. */
  .lined .sheet {
    background-image: repeating-linear-gradient(
      to bottom, transparent 0 25px, rgba(0, 0, 0, .06) 25px 26px);
    background-position: 0 var(--pad, 78px);
    background-size: 100% calc(var(--body-h, 698px));
    background-repeat: no-repeat;
  }
  .lined .sheet::before {
    content: "";
    position: absolute;
    left: calc(var(--pad, 78px) - 14px);
    top: var(--pad, 78px);
    bottom: var(--pad, 78px);
    border-left: 1px solid #b9b9b3;
  }

  /* Themes and the document font. Kentucky wants a serif, and all
     three of these are one. */
  .theme-book .page-body { color: #17181a; }
  .theme-book .k-head, .theme-book .k-title { letter-spacing: .02em; }
  .theme-plain .k-body, .theme-plain .k-item { text-align: left; hyphens: none; }
  .docfont-century .page-body { font-family: "Century Schoolbook", Georgia, var(--doc); }
  .docfont-book .page-body { font-family: "Book Antiqua", Palatino, var(--doc); }

  /* ---- block kinds ------------------------------------------------ */

  .p { margin: 0; font: inherit; }
  .p.u { text-decoration: underline; }

  .k-caption, .k-efile, .k-title, .k-head, .k-certhead {
    text-align: center;
    line-height: 1.2;
  }
  .k-caption { line-height: 1.25; }
  .k-efile { font-style: italic; line-height: 1.25; margin-bottom: 10px; }

  .k-party {
    display: flex;
    align-items: flex-start;
    gap: 12px;
    line-height: 1.25;
  }
  .k-party .pn { flex: 1; }
  .k-party .role { flex: none; align-self: flex-end; }
  .k-party.ruled { border-bottom: 1px solid #000; padding-bottom: 2px; margin-bottom: 8px; }

  .k-vline { line-height: 1.25; margin: 6px 0; }

  .k-title { font-weight: 700; margin-top: 12px; }
  .k-title + .k-title { margin-top: 0; }
  .k-title.u, .k-certhead.u { text-decoration: underline; }

  .k-head {
    font-weight: 700;
    margin: 14px 0 4px;
  }

  .k-body, .k-item, .k-defbody, .k-wherefore, .k-certbody {
    text-align: justify;
    text-indent: 2.5em;
    margin-left: var(--ind, 0);
    hyphens: auto;
  }
  .k-item { text-indent: 0; padding-left: 2.5em; }

  /* Word owns this number. It is derived from position at render, so
     removing the third defense renumbers everything below it. */
  .k-defhead {
    font-weight: 700;
    text-align: center;
    text-decoration: underline;
    margin: 14px 0 2px;
    user-select: none;
  }
  .k-defhead::selection { background: transparent; }

  .k-wherefore { margin-top: 12px; }

  .k-sig { margin-left: 48%; line-height: 1.25; }
  .k-sig.tight { margin-top: 0; }

  .k-certhead { font-weight: 700; text-decoration: underline; margin: 18px 0 8px; }
  .k-cert { line-height: 1.25; }

  .k-memohead { line-height: 1.5; }
  .k-memoline { line-height: 1.5; text-align: left; }
  .k-quote { margin: 8px 40px; line-height: 1.3; text-align: justify; }

  .k-row {
    display: flex;
    gap: 10px;
    border-bottom: 1px solid #000;
    padding: 2px 0;
    line-height: 1.5;
  }
  .k-row.head { font-weight: 700; border-bottom-width: 1.5px; }
  .k-row .cell { flex: 1; min-width: 0; }

  .k-plate {
    margin: 10px 0;
    text-align: center;
    line-height: 1.3;
  }
  .k-plate svg { width: 74%; margin: 0 auto; border: 1px solid #999; }
  .plate-cap {
    display: block;
    margin-top: 4px;
    font-size: 10.5px;
    font-style: italic;
  }

  .k-blank { min-height: 26px; }
  .k-blank::after { content: ""; }

  .k-pagebreak {
    height: 0;
    border-top: 1px dashed #b6bcb2;
    margin: 6px 0;
    position: relative;
  }

  /* The first note on a page takes the free space above it, which
     lands it on the foot. The rest stack under it. */
  .k-foot { margin-top: auto; }
  .k-foot ~ .k-foot { margin-top: 4px; }
  .k-foot {
    font-size: 10.5px;
    line-height: 1.25;
    text-align: justify;
    text-indent: 1.5em;
    margin-top: 6px;
    padding-top: 5px;
    border-top: 1px solid #000;
    border-top-width: 1px;
    max-width: 45%;
  }
  .fnref { font-size: .72em; vertical-align: super; line-height: 0; }

  /* ---- style names from the gallery ------------------------------- */

  .s-h1 { font-size: 15px; font-weight: 700; text-align: left; }
  .s-h2 { font-size: 14px; font-weight: 700; text-align: left; }
  .s-h3 { font-size: 13px; font-weight: 700; font-style: italic; text-align: left; }
  .s-nospace { line-height: 1.15; text-indent: 0; }

  /* ---- alignment overrides ---------------------------------------- */

  .a-left { text-align: left; }
  .a-center { text-align: center; text-indent: 0; }
  .a-right { text-align: right; text-indent: 0; }
  .a-justify { text-align: justify; }

  /* ---- paragraph marks -------------------------------------------- */

  .marks .p:not(.k-blank)::after {
    content: "\00b6";
    color: #7aa0e8;
    margin-left: 2px;
    font-family: var(--sans);
  }
  .marks .k-blank::after {
    content: "\00b6";
    color: #7aa0e8;
    font-family: var(--sans);
  }

  /* ---- content controls. The firm's own blocks, lit as one run when
     the pointer or the keyboard is anywhere inside them. ------------- */

  .p[data-ctl] { position: relative; }
  .ctl-lit[data-ctl]::before,
  .ctl-lit[data-ctl]::after {
    position: absolute;
    color: var(--accent);
    font-family: var(--sans);
    font-size: 12px;
    top: 0;
  }
  .ctl-lit[data-ctl]::before { content: "\005b"; left: -10px; }
  .ctl-lit[data-ctl]::after { content: "\005d"; right: -10px; }

  /* ---- track changes ---------------------------------------------- */

  ins { text-decoration: underline; color: #7a2f8c; }
  del { text-decoration: line-through; color: #8c2f2f; }

  /* ---- find ------------------------------------------------------- */

  mark.find { background: #ffe58a; color: inherit; }
  mark.find.on { background: #ffb300; }

  /* ---- the flash after an insert ---------------------------------- */

  @keyframes flash {
    0% { background: rgba(178, 58, 43, .17); }
    100% { background: transparent; }
  }
  .p.flash { animation: flash 1400ms var(--ease-soft); }

  /* ---- focus mode hides everything but the page ------------------- */

  .focus-mode #doc-canvas { background: #23261f; padding-top: 40px; }
}


/* ================================================================
   src/css/70-pane.css
   ================================================================ */
/* =====================================================================
   70-pane.css   the add-in.

   Ported from the shipping pane's app.css and kept close to it on
   purpose. Flat fills, one red accent where the action lives, no
   gradients, no pills. Light because it lives inside Word.

   Watch the cascade here: a bare .pane-info loses to .pane button and
   silently bleached the info chip once, so anything styled inside the
   pane needs matching specificity.
   ===================================================================== */

@layer pane {
  .pane-col {
    flex: none;
    width: var(--pane-w, 348px);
    min-width: 0;
    display: flex;
    flex-direction: column;
    position: relative;
    border-left: 1px solid var(--w-line);
    background: var(--bg);
  }

  /* The handle. Docked it resizes the column; floating it hands off to
     the window manager, and which one is decided at pointerdown. */
  .pane-grip {
    position: absolute;
    left: -3px; top: 0; bottom: 0;
    width: 7px;
    cursor: ew-resize;
    z-index: var(--z-raise);
    touch-action: none;
  }
  .pane-grip::after {
    content: "";
    position: absolute;
    left: 3px; top: 50%;
    width: 1px; height: 28px;
    margin-top: -14px;
    background: var(--w-line);
    transition: background var(--t-1) var(--ease-soft);
  }
  .pane-grip:hover::after, .pane-grip:focus-visible::after { background: var(--accent); }

  /* Word draws this band, not the add-in. It is also the handle: press
     and pull and the pane comes off, which is the gesture the real one
     uses. touch-action is set here and nowhere wider, because turning
     it off on the document would take pinch zoom with it. */
  .pane-host {
    flex: none;
    display: flex;
    align-items: center;
    gap: 6px;
    height: 26px;
    padding: 0 8px;
    background: var(--w-bar);
    border-bottom: 1px solid var(--w-line);
    cursor: grab;
    touch-action: none;
    user-select: none;
  }
  .pane-host:active { cursor: grabbing; }
  .pane-host-name { flex: 1; font-size: 12px; font-weight: 600; color: var(--w-ink); }
  .pane-host-x {
    width: 18px; height: 18px;
    display: grid; place-items: center;
    border-radius: 50%;
    color: var(--w-dim);
    cursor: pointer;
  }
  .pane-host-x:hover { background: var(--w-hover); color: var(--w-ink); }

  /* ---- the slot the pane came out of --------------------------------

     The column stays exactly where it was for the whole drag. Word does
     not reflow underneath, the visitor can see where the pane belongs,
     and pointer capture stays on a band that is still being rendered
     instead of on a node inside a hidden subtree. */
  .pane-col.pane-slot { background: var(--w-bar); }
  .pane-col.pane-slot::after {
    content: "";
    position: absolute;
    inset: 27px 6px 6px 6px;
    border: 1px dashed var(--w-line);
    border-radius: var(--r);
    pointer-events: none;
    transition: background var(--t-1) var(--ease-soft), border-color var(--t-1) var(--ease-soft);
  }
  .pane-col.pane-slot .pane-host { opacity: .55; }
  .pane-col.dock-near::after {
    border-color: var(--accent);
    border-style: solid;
    background: rgba(226, 114, 90, .12);
  }

  /* ---- the pane itself ---------------------------------------------- */

  .pane {
    flex: 1;
    min-height: 0;
    overflow: auto;
    background: var(--bg);
    color: var(--ink);
    font: 13px/1.45 var(--sans);
    padding: 0 12px 12px;
    scrollbar-width: thin;
  }
  .pane.viewing {
    display: flex;
    flex-direction: column;
    overflow: hidden;
    padding-bottom: 0;
  }
  .pane.viewing #diagnostics { display: none; }

  @keyframes pane-in {
    from { opacity: 0; transform: translateX(10px); }
  }
  .pane.pane-in { animation: pane-in var(--t-2) var(--ease); }

  .pane-head {
    display: flex;
    align-items: center;
    gap: 9px;
    margin: 0 -12px 12px;
    padding: 12px 14px 10px;
    background: var(--green);
    border-right: 6px solid #fff;
    box-shadow: inset -8px 0 0 var(--green-soft);
    position: relative;
  }
  /* ---- one putt across the lockup -----------------------------------

     Drawn over the green band, under nothing, and it never takes a
     pointer event. The mark and the wordmark ask to be clicked, so they
     say so with the cursor and nothing else. */
  .lp {
    position: absolute;
    inset: 0;
    pointer-events: none;
    overflow: hidden;
  }
  .lp-ball, .lp-putter {
    position: absolute;
    will-change: transform;
  }
  /* The ball is white and so is the wordmark it rolls across, so
     without this it disappears for the middle third of the putt. The
     shadow doubles as the thing that puts it on the ground. */
  .lp-ball svg { display: block; }
  .lp-ball { filter: drop-shadow(0 1px 1.5px rgba(0, 0, 0, .6)); }
  .lp-putter {
    transform-origin: 50% 50%;
    opacity: .95;
  }
  .lp-putter svg { display: block; }
  /* The front edge of the cup, repainted, so the ball drops behind the
     rim rather than sitting on top of the mark. */
  .lp-rim {
    position: absolute;
    height: 3px;
    border-radius: 0 0 50% 50% / 0 0 100% 100%;
    background: var(--green);
  }
  .pane-head .mark, .pane-head h1 { cursor: pointer; }

  .pane-head h1 {
    font-size: 15px;
    font-weight: 700;
    letter-spacing: .5px;
    color: #fff;
  }
  /* Word floats this chip over the band's top right corner. */
  .pane button.pane-info {
    position: absolute;
    right: 10px; top: 8px;

    width: 18px; height: 18px;
    border-radius: 3px;
    background: #2a2a28;
    color: #fff;
    font: italic 700 11px/18px var(--doc);
    text-align: center;
  }
  .pane button.pane-info:hover { background: #3a3a37; }

  .info-pop {
    position: absolute;
    right: 8px; top: 32px;
    width: 250px;
    padding: 10px;
    background: #fff;
    border: 1px solid var(--line);
    border-radius: var(--r);
    box-shadow: var(--lift-1);
    color: var(--ink);
    font-size: 11.5px;
    line-height: 1.45;
    z-index: var(--z-overlay);
  }
  .info-pop p + p { margin-top: 6px; }

  /* ---- tab strip ------------------------------------------------------ */

  #pane-tabs {
    display: flex;
    margin: -12px -12px 12px;
    background: var(--panel);
    border-bottom: 1px solid var(--line);
    overflow-x: auto;
    scrollbar-width: none;
  }
  #pane-tabs::-webkit-scrollbar { height: 0; }
  #nav-tabs { display: flex; position: sticky; left: 0; z-index: var(--z-sticky); background: var(--panel); }

  .pane .pane-tab {
    padding: 7px 12px;
    font-size: 12px;
    color: var(--muted);
    border-bottom: 2px solid transparent;
    white-space: nowrap;
    border-radius: 0;
  }
  .pane .pane-tab:hover { color: var(--ink); }
  .pane .pane-tab.active {
    color: var(--ink);
    font-weight: 600;
    background: var(--bg);
    border-bottom-color: var(--accent);   /* the flag marks the active hole */
  }
  .pane-tab-file {
    display: flex; align-items: center; gap: 4px;
    min-width: 84px; max-width: 140px;
    padding: 7px 8px 7px 12px;
    font-size: 12px;
    color: var(--muted);
    border-bottom: 2px solid transparent;
  }
  .pane-tab-file.active {
    color: var(--ink); font-weight: 600;
    background: var(--bg); border-bottom-color: var(--accent);
  }
  .pane .tab-file-name {
    flex: 1; min-width: 0;
    text-align: left;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    font: inherit; color: inherit;
  }
  .pane .tab-file-close {
    flex: none;
    width: 24px; height: 24px;
    margin: -4px -6px -4px 0;
    font-size: 11px;
    color: var(--muted);
    border-radius: 0;
  }
  .pane .tab-file-close:hover { color: var(--danger); }

  /* ---- home ------------------------------------------------------------ */

  #view-home { padding-top: 10px; }
  #home-greeting { font-size: 13px; color: var(--muted); margin: 2px 0 12px; }
  .home-doors { display: flex; gap: 12px; }
  .pane button.home-row {
    flex: 1 1 0;
    display: flex; flex-direction: column;
    align-items: center; gap: 10px;
    padding: 18px 10px 14px;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: var(--r-door);
    color: var(--ink);
    transition: transform var(--t-1) var(--ease), border-color var(--t-1) var(--ease);
  }
  .pane button.home-row:hover { transform: translateY(-2px); border-color: var(--green-soft); }
  .home-label { font-size: 13.5px; font-weight: 600; }

  /* The course rolls away below the doors and the flag waits on the
     ridge. It sits on the floor of the pane, not in the middle of it,
     so the space under the two doors reads as distance rather than as
     something nobody got around to filling. */
  .pane.homing { display: flex; flex-direction: column; }
  .pane.homing #view-home {
    flex: 1;
    min-height: 0;
    display: flex;
    flex-direction: column;
  }
  .pane.homing .home-horizon { margin-top: auto; }
  .pane.homing #diagnostics { flex: none; }
  .home-horizon {
    position: relative;
    margin: 34px -12px 0;
    height: 46px;
  }
  .home-horizon .ground { width: 100%; height: 46px; }
  .home-horizon .far-flag { position: absolute; right: 34px; bottom: 16px; }
  .home-horizon .tuft { position: absolute; left: 38px; bottom: 6px; }

  /* ---- case files -------------------------------------------------------- */

  #case-head { display: flex; flex-direction: column; gap: 6px; margin-bottom: 8px; }
  .case-head-wrap { display: flex; flex-direction: column; gap: 4px; width: 100%; }
  .case-row { display: flex; align-items: baseline; gap: 8px; }
  .case-name { font-size: 13px; font-weight: 600; }
  .case-where {
    flex: 1 1 auto;
    font-size: 11px;
    color: var(--muted);
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .case-links { display: flex; gap: 10px; }
  #file-search { margin-top: 2px; }

  .pane button.link {
    font: 11px/1.4 var(--sans);
    color: var(--green-soft);
    text-decoration: underline;
    padding: 0;
  }
  .pane button.link:hover { color: var(--accent); }

  .scroll-list {
    border: 1px solid var(--line);
    border-radius: var(--r);
    overflow: auto;
    max-height: 300px;
  }
  .scroll-list.short { max-height: 180px; }
  .scroll-list.tall { max-height: 460px; }

  .tree-dir, .tree-file {
    display: flex; align-items: center; gap: 6px;
    padding: 6px 8px;
    border-bottom: 1px solid var(--line);
    cursor: default;
  }
  .tree-dir:hover, .tree-file:hover { background: var(--panel); }
  .tree-node:last-child .tree-dir { border-bottom: 0; }
  .tree-dir { font-weight: 600; }
  .tree-dir .chev { transition: transform var(--t-1) var(--ease-soft); flex: none; color: var(--muted); }
  .tree-dir.open .chev { transform: rotate(90deg); }
  .tree-file .g { flex: none; color: var(--muted); }
  .tree-name { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .tree-meta { flex: none; font-size: 11px; color: var(--muted); }
  .case-hit .tree-meta { max-width: 45%; overflow: hidden; text-overflow: ellipsis; }
  .tree-kids { border-left: 1px solid var(--line); margin-left: 10px; }

  .tree-empty {
    display: flex; flex-direction: column;
    align-items: center; gap: 6px;
    padding: 18px 16px;
    font-size: 12.5px; color: var(--muted);
    text-align: center;
  }
  .tree-note { padding: 6px 8px; font-size: 11px; color: var(--muted); }

  .pane input[type="search"], .pane select {
    width: 100%;
    padding: 5px 8px;
    border: 1px solid var(--line);
    border-radius: var(--r);
    background: #fff;
    font: 12px var(--sans);
    color: var(--ink);
  }
  .pane input[type="search"]:hover, .pane select:hover { border-color: var(--green-soft); }

  /* ---- viewer -------------------------------------------------------------- */

  #view-viewer { flex: 1; min-height: 0; margin: 0 -12px; display: flex; }
  .viewer-frame { flex: 1; min-height: 0; display: flex; flex-direction: column; }
  .win-caddy #view-viewer, .win-file .viewer-frame { height: 100%; }

  /* min-width: 0 the whole way down. A flex item's default floor is its
     content, so one nowrap label in this bar was setting the width of
     the pane itself and pushing the paper off the right of a phone. */
  #view-viewer, .viewer-frame { min-width: 0; }
  .v-bar {
    flex: none;
    display: flex; align-items: center; gap: 8px;
    padding: 8px 10px;
    background: var(--green);
    min-width: 0;
  }
  .v-name {
    flex: 1; min-width: 0;
    font-size: 13px; font-weight: 600; color: #fff;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  /* The path, once the window title is already saying the name. Quieter,
     because it is context and not a heading. */
  .v-name.v-where {
    font-size: 11.5px; font-weight: 500;
    color: rgba(255, 255, 255, .72);
  }
  .v-bar button {
    padding: 4px 8px;
    font-size: 12px;
    color: #fff;
    border: 1px solid var(--v-btn-line);
    border-radius: var(--r);
    background: transparent;
    display: flex; align-items: center; gap: 5px;
  }
  .v-bar button:hover { border-color: #fff; }
  .v-meta {
    flex: none;
    font-size: 10.5px;
    color: rgba(255, 255, 255, .68);
    white-space: nowrap;
    font-variant-numeric: tabular-nums;
  }
  .v-zoom, .v-bar button { flex: none; }
  .v-zoom { display: flex; align-items: center; gap: 4px; }
  .v-zoom button { font-weight: 700; }
  .v-pct { font-size: 11px; color: #fff; min-width: 38px; text-align: center;
           font-variant-numeric: tabular-nums; }
  .v-bar .popout .flag { transition: transform var(--t-2) var(--ease); transform-origin: 60% 85%; }
  .v-bar .popout:hover .flag { transform: rotate(-6deg); }

  .v-body {
    flex: 1;
    min-height: 0;
    overflow: auto;
    background: var(--ground);
    padding: 12px 0;
  }

  /* The rest of the block vocabulary. The reader used to style nine

  .v-page .k-efile { text-align: right; font-size: 10.5px; font-style: italic; }

  .v-page .k-wherefore { text-align: justify; text-indent: 2em; margin: 6px 0; }
  .v-page .k-defhead { font-weight: 700; text-align: center; margin: 8px 0 3px; }

  .v-page .k-blank { height: 8px; }

  .tline { display: flex; gap: 10px; font: 11.5px/1.9 var(--mono); }

  .phead { text-align: center; font-size: 10.5px; color: var(--muted); margin-bottom: 8px;

  .v-wait { padding: 20px; text-align: center; font-size: 12px; color: #444; }

  .sec-n { font-size: 11px; color: var(--muted); font-weight: 400; }

  .sf-name { flex: 1; min-width: 0; }
  .pane button.sf-peek {

  .pane button.sf-peek:hover { color: var(--green-soft); background: #fff; }

  .sf-preview {
    padding: 8px 12px 10px 26px;
    background: var(--panel);

  }
  .sf-page {
    background: #fff;
    border: 1px solid var(--line);

  .mod-note {
    font-size: 11px;

    padding-left: 8px;

  }
  .mod-note.src { color: var(--muted); border-left: 0; padding-left: 0; margin-top: 2px; }
  .mod-preview { font-size: 11px; color: var(--muted); margin-top: 4px; white-space: pre-line; }

  .cur { padding: 6px 8px; border-bottom: 1px solid var(--line); }

  .cur-ord { font-size: 11px; font-weight: 600; letter-spacing: .03em; flex: 1; cursor: default; }

  }
  .cur-snip { font-size: 11px; color: var(--muted); margin-top: 2px; }

  .confirm {
    background: var(--confirm-bg);
    border: 1px solid var(--danger);
    border-radius: var(--r);
    padding: 6px 8px;
    margin-top: 5px;
    font-size: 11px;
  }
  .confirm .btn-row { display: flex; gap: 6px; margin-top: 5px; }
  .pane .confirm button {
    padding: 2px 9px; font-size: 11px;
    border: 1px solid var(--line); border-radius: var(--r);
  }
  .pane .confirm button.yes { background: var(--danger); color: #fff; border-color: var(--danger); }

  .build-foot { margin-top: 10px; }
  .build-count { font-size: 12px; color: var(--ink); margin-bottom: 6px; }
  .pane button.build-go {
    width: 100%;
    padding: 8px 10px;
    background: var(--green);
    color: #fff;
    border-radius: var(--r);
    font-size: 13px;
    font-weight: 600;

  #pane-status.warn { color: var(--warn); }
  #pane-status.err { color: var(--danger); }

  #diagnostics { border-top: 1px solid var(--line); padding-top: 8px; margin-top: 12px; }

    font-size: 11px; text-transform: uppercase; letter-spacing: .1em;

    border: 1px solid var(--line); border-radius: var(--r);

    margin-top: 6px; max-height: 180px; overflow: auto;

    background: var(--panel);
    border-radius: var(--r);

       action. The page count and the size are worth having and are not

    .v-meta { display: none; }
    .v-bar { gap: 6px; padding: 8px; }
    .v-bar button { padding: 4px 6px; }
  }
}

/* =====================================================================
   80-motion.css   the callout, the last few pieces, and the switch
   that turns every animation in the file off at once.
   ===================================================================== */

@layer state {
  .noscript {
    max-width: 44ch;
    margin: 18vh auto;
    padding: 0 24px;
    color: var(--desk-ink);
    font-family: var(--display);
  }
  .noscript h1 { font-size: 34px; margin-bottom: 12px; }
  .noscript p { font-size: 15px; line-height: 1.6; color: var(--desk-dim); }

  /* ---- the matter-detection callout -------------------------------- */

  /* Caddy's own furniture: the cream panel, the green ink, the one red
     accent. A white card with bolded fragments and a Got it button is
     the shape an operating system uses to tell you it wants to restart,
     and this is the moment the product is actually proud of. */
  .callout {
    position: absolute;
    width: 252px;
    padding: 11px 13px 12px;
    background: var(--panel);
    color: var(--ink);
    border: 1px solid var(--line);
    border-left: 3px solid var(--accent);
    border-radius: var(--r);
    box-shadow: var(--lift-2);
    z-index: var(--z-guide);
    font-size: 12.5px;
    line-height: 1.45;
  }
  .callout-lead {
    display: block;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: .06em;
    text-transform: uppercase;
    color: var(--accent);
    margin-bottom: 5px;
  }
  /* The path, drawn as a path. */
  .callout-path {
    display: flex;
    flex-wrap: wrap;
    align-items: baseline;
    gap: 3px 4px;
    margin-bottom: 7px;
    padding-bottom: 7px;
    border-bottom: 1px solid var(--line);
    font-size: 11.5px;
    font-weight: 600;
    color: var(--green);
  }
  .callout-sep { color: var(--muted); font-style: normal; }
  .callout p { color: var(--ink); }

  /* One elbow, drawn with two borders, from the document name to the
     case it resolved to. */
  .callout-line {
    position: absolute;
    z-index: var(--z-guide);
    pointer-events: none;
    border-top: 1px solid var(--accent);
    opacity: .9;
  }
  .callout-line::after {
    content: "";
    position: absolute;
    right: -1px; top: -3px;
    width: 5px; height: 5px;
    border-radius: 50%;
    background: var(--accent);
  }

  /* ---- the plate the page prints while it is still assembling ------- */

  .boot-note {
    position: absolute;
    inset: 0;
    display: grid;
    place-items: center;
    color: var(--desk-dim);
    font-family: var(--display);
    font-size: 15px;
  }

  /* ---- one switch --------------------------------------------------- */

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation-duration: .001ms !important;
      animation-iteration-count: 1 !important;
      transition-duration: .001ms !important;
      scroll-behavior: auto !important;
    }
    /* The global switch above would leave the trace mid-stroke, which
       is to say invisible. A visitor who asked for calm still gets the
       ring, they just do not watch it being drawn. */
    .trace rect {
      animation: none !important;
      stroke-dashoffset: 0 !important;
      opacity: .8;
    }
  }
}

     section   must equal a SECTIONS key exactly, or the form is drawn
               by nothing while the search box still counts it.
     kind      selects the skeleton 54-builder.js composes. One of
               answer, complaint, motion, response, discovery,
               responses, order, notice, letter, chart, release.
     companion defenses on the answer forms, objections on the three
               discovery response forms, null everywhere else.

   the practice and older than any one case. No matter name appears in

    { key: "causation-unavoidable",
      part: "causation",
      label: "Unavoidable accident",
      body: "The events described in the Complaint constituted an unavoidable accident that occurred without negligence on the part of this Defendant." },

    { key: "causation-sole-cause",
      part: "causation",
      label: "Sole cause: the conduct of another",
      body: "The sole proximate cause of the injuries and damages claimed was the conduct of a person other than this Defendant, and no fault may properly be allocated to this Defendant." },

    { key: "causation-assumption-of-risk",
      part: "causation",
      label: "Assumption of risk",
      tag: "[PLEAD AS FAULT]",
      note: "Kentucky merged assumption of risk into comparative fault. Plead it as the Plaintiff's fault or it buys nothing at the instruction conference.",
      body: "The Plaintiff knew of and voluntarily encountered the risk that produced the injuries claimed, and that conduct is to be considered in the allocation of fault under KRS 411.182." },

    { key: "causation-act-of-god",
      part: "causation",
      label: "Act of God",
      body: "The injuries and damages claimed were caused by an act of God, a natural event of such character that no degree of care on the part of this Defendant would have prevented the harm." },

    { key: "causation-respondeat-admitted",
      part: "causation",
      label: "Respondeat superior admitted; derivative claims merge",
      note: "Admitting scope is the trade that keeps the driver's personnel file out of the case. Make the call with the carrier before the Answer is filed.",
      body: "This Defendant admits that its employee was acting within the course and scope of employment at the time of the events described in the Complaint. The claims for negligent hiring, training, retention, supervision and entrustment are therefore merged into the claim for vicarious liability and add nothing to the Plaintiff's recovery." },

    { key: "causation-negligent-hiring",
      part: "causation",
      label: "Due care in hiring, training and retention",
      tag: "[IF SCOPE IS NOT ADMITTED]",
      body: "This Defendant exercised ordinary care in the hiring, training, retention and supervision of its employees. The employee whose conduct is at issue was qualified for the position held, satisfied every applicable qualification requirement at the time of hire and thereafter, and no deficiency in hiring, training, retention or supervision was a substantial factor in causing the injuries claimed." },

    /* ---------------------------------------------------------------
       III. MOTOR VEHICLE REPARATIONS ACT
       --------------------------------------------------------------- */

    { key: "mvra-threshold",
      part: "mvra",
      label: "Threshold not met",
      tag: "[MOTOR VEHICLE CASES]",
      note: "Threshold is arithmetic plus proof. Add the reasonable and necessary charges yourself instead of trusting the number in the demand package.",
      body: "The Plaintiff's claim for pain, suffering, mental anguish and inconvenience is barred by KRS 304.39-060(2)(b). The benefits payable for the injuries claimed as medical expense, together with those that would be payable but for any exclusion or deductible authorized by that subtitle, do not exceed one thousand dollars, and the Plaintiff has not sustained permanent disfigurement, a fracture to a bone, a compound, comminuted, displaced or compressed fracture, the loss of a body member, a permanent injury within reasonable medical probability, a permanent loss of bodily function or death." },

    { key: "mvra-abolition",
      part: "mvra",
      label: "Tort liability abolished to the extent of reparation benefits",
      body: "Tort liability for damages because of bodily injury arising from the ownership, maintenance or use of a motor vehicle is abolished by KRS 304.39-060(2)(a) to the extent that basic reparation benefits are payable, or would be payable but for a deductible authorized by that subtitle, and the Plaintiff may not recover those elements of loss in this action." },

    { key: "mvra-brb-setoff",
      part: "mvra",
      label: "Basic reparation benefit setoff",
      body: "This Defendant is entitled to a credit against any award for all basic reparation benefits paid or payable to or on behalf of the Plaintiff under KRS 304.39-060(2)(a), and any verdict must be reduced by the amount of those benefits." },

    { key: "mvra-acceptance",
      part: "mvra",
      label: "Acceptance of the tort limitations",
      body: "The Plaintiff, having registered, operated, maintained or used a motor vehicle upon the public roadways of this Commonwealth, is deemed by KRS 304.39-060(1) to have accepted the provisions of that subtitle, and no exception stated in KRS 304.39-060(2)(c) applies to the Plaintiff." },

    { key: "mvra-no-rejection",
      part: "mvra",
      label: "No rejection of the tort limitations",
      note: "Ask for the rejection form in the first set of requests. The filing date with the Department of Insurance is the fact that decides it.",
      body: "The Plaintiff did not refuse to consent to the limitations upon tort rights and liabilities in the writing or electronic form and in the manner that KRS 304.39-060(4) requires, and no rejection was executed and filed with the Department of Insurance at a time prior to the collision. The Plaintiff's claims remain subject to the limitations of that subtitle." },

    { key: "mvra-limitations",
      part: "mvra",
      label: "Motor vehicle limitation period",
      note: "A replacement payment does not extend the date beyond the original payment. Ask the reparation obligor in writing which payments were replacements.",
      body: "The claims asserted are barred by KRS 304.39-230(6), which permits an action for tort liability not abolished by KRS 304.39-060 to be commenced not later than two years after the injury, the death, or the date of issuance of the last basic or added reparation payment made by any reparation obligor, whichever later occurs." },

    { key: "mvra-obligor-reimbursement",
      part: "mvra",
      label: "Reparation obligor's claim; no double recovery",
      body: "Every element of loss for which a reparation obligor has paid or is obligated to pay benefits is subject to that obligor's rights of reimbursement, subrogation and indemnity under KRS 304.39-070, and the Plaintiff may not recover those sums a second time in this action." },

    { key: "mvra-threshold-proof",
      part: "mvra",
      label: "Threshold proof: reasonable and necessary charges",
      body: "Medical expenses that were unreasonable in amount, unnecessary, or unrelated to the collision do not count toward the medical expense threshold of KRS 304.39-060(2)(b), and the Plaintiff bears the burden of proving that each charge relied upon satisfies those requirements." },

    { key: "mvra-permanency",
      part: "mvra",
      label: "No permanent injury within reasonable medical probability",
      body: "No physician has stated within reasonable medical probability that the Plaintiff sustained a permanent injury, a permanent loss of bodily function or a permanent disfigurement, and the injury exceptions to the threshold of KRS 304.39-060(2)(b) therefore do not apply." },

    { key: "mvra-wage-loss",
      part: "mvra",
      label: "Work loss and replacement services",
      body: "The Plaintiff's claims for lost wages and for the value of services duplicate work loss and replacement services loss payable as basic reparation benefits, and tort liability for those elements of loss is abolished by KRS 304.39-060(2)(a) to the extent the benefits are payable." },

    /* ---------------------------------------------------------------
       IV. UIM / UM CARRIER
       --------------------------------------------------------------- */

    { key: "uim-exhaustion",
      part: "uim",
      label: "Failure to exhaust liability coverage",
      tag: "[UIM CLAIMS]",
      body: "The Plaintiff has not exhausted the liability coverage available to the tortfeasor. No underinsured motorist benefits are owed under the policy or under KRS 304.39-320 unless and until those liability limits are exhausted by payment or by judgment." },

    { key: "uim-consent-to-settle",
      part: "uim",
      label: "Settlement without consent",
      note: "Put the notice letter and the release side by side. The two dates decide this defense and nothing else in the file will.",
      body: "The Plaintiff settled with and released the tortfeasor without giving this Defendant the notice and the opportunity to preserve its rights by advance payment that KRS 304.39-320 and the policy require. The claim for underinsured motorist benefits is barred or reduced to the extent that the subrogation rights of this Defendant were destroyed or prejudiced." },

    { key: "uim-not-underinsured",
      part: "uim",
      label: "The vehicle is not underinsured",
      body: "The vehicle identified in the Complaint is not an underinsured motor vehicle within the meaning of KRS 304.39-320, because the liability coverage available to its owner and operator equals or exceeds the damages the Plaintiff is legally entitled to recover." },

    { key: "uim-liability-offset",
      part: "uim",
      label: "Offset for liability payments",
      body: "Any underinsured motorist benefits owed must be reduced by the full amount of the liability coverage available to the tortfeasor, whether or not that coverage was collected, and by every sum paid to or on behalf of the Plaintiff by or for any person legally responsible for the collision." },

    { key: "uim-brb-offset",
      part: "uim",
      label: "Offset for reparation benefits",
      body: "Any underinsured motorist benefits owed must be reduced by all basic and added reparation benefits paid or payable to or on behalf of the Plaintiff, and by every other offset, credit and limitation the policy provides." },

    { key: "uim-policy-limits",
      part: "uim",
      label: "Recovery limited by the policy",
      note: "Produce the certified policy with the first response. A coverage defense you cannot document is not a defense.",
      body: "The obligations of this Defendant are governed and limited by the terms, conditions, definitions, exclusions and limits of liability of the policy of insurance issued to the Plaintiff, which is pleaded as though set out in full herein." },

    { key: "uim-no-stacking",
      part: "uim",
      label: "No stacking of coverages",
      body: "The Plaintiff may not aggregate the underinsured motorist limits of separate vehicles or of separate policies. The policy limits the coverage available for any one accident to a single limit of liability and excludes the stacking of limits." },

    { key: "uim-owned-vehicle",
      part: "uim",
      label: "Owned vehicle exclusion",
      body: "The vehicle occupied by the Plaintiff at the time of the collision was owned by or furnished for the regular use of the Plaintiff or a resident relative and was not a covered vehicle for underinsured motorist coverage under the policy. The coverage sought is excluded by the terms of the policy." },

    { key: "uim-notice-cooperation",
      part: "uim",
      label: "Late notice and failure to cooperate",
      body: "The Plaintiff failed to give this Defendant prompt notice of the claim and failed to cooperate in its investigation as the policy requires, including by declining to submit to examination under oath and by withholding requested records and authorizations, to the prejudice of this Defendant." },

    { key: "uim-suit-limitation",
      part: "uim",
      label: "Contractual limitation period",
      body: "The claim is barred by the limitation period stated in the policy, which requires that any action against this Defendant be commenced within the period the policy prescribes." },

    { key: "uim-subrogation",
      part: "uim",
      label: "Preservation of subrogation and reimbursement rights",
      body: "This Defendant asserts and preserves its rights of subrogation, reimbursement and credit against every person legally responsible for the injuries claimed and against the proceeds of any recovery obtained by the Plaintiff from any such person." },

    { key: "uim-um-unidentified",
      part: "uim",
      label: "Uninsured motorist: unidentified vehicle",
      tag: "[UM CLAIMS]",
      body: "The Plaintiff cannot establish the existence or the fault of the unidentified motor vehicle alleged. The uninsured motorist coverage afforded under KRS 304.20-020 and the policy is not available for a loss supported only by the Plaintiff's own account of a vehicle that was never identified." },

    /* ---------------------------------------------------------------
       V. BAD FAITH / UCSPA
       --------------------------------------------------------------- */

    { key: "badfaith-elements",
      part: "badfaith",
      label: "The elements of bad faith are not met",
      note: "All three elements or nothing. The reasonable basis element is proved out of the claim file, so read the file before the Answer is drafted.",
      body: "The Plaintiff cannot establish that this Defendant was obligated to pay the claim under the terms of the policy, that it lacked a reasonable basis in law or in fact for denying or delaying payment, or that it knew there was no reasonable basis for its conduct or acted with reckless disregard of that fact. The claims for statutory and common law bad faith fail as a matter of law." },

    { key: "badfaith-no-obligation",
      part: "badfaith",
      label: "No obligation to pay under the policy",
      body: "No claim for bad faith may be maintained where the insurer owed no obligation to pay under the terms of the policy, and this Defendant owed no such obligation for the loss described in the Complaint." },

    { key: "badfaith-bona-fide-dispute",
      part: "badfaith",
      label: "Bona fide dispute",
      body: "A bona fide dispute existed as to liability, as to coverage and as to the extent of the damages claimed. An insurer that contests a claim upon a reasonable basis is not liable under KRS 304.12-230 or at common law." },

    { key: "badfaith-premature",
      part: "badfaith",
      label: "Claim premature: no settled or adjudicated claim",
      tag: "[FIRST PARTY CLAIMS]",
      note: "Premature is a stay argument as much as a defense. Plead it, then move to bifurcate before the claim file is due.",
      body: "The extracontractual claims are premature. The underlying claim has neither been settled nor reduced to judgment, no obligation to pay has been established, and no cause of action for bad faith has accrued." },

    { key: "badfaith-no-general-practice",
      part: "badfaith",
      label: "No general business practice",
      body: "The conduct alleged does not constitute a general business practice of unfair claim settlement, and the isolated acts described in the Complaint do not support a claim under KRS 304.12-230." },

    { key: "badfaith-reasonable-investigation",
      part: "badfaith",
      label: "Reasonable investigation and good faith evaluation",
      body: "This Defendant conducted a reasonable investigation of the claim, evaluated it in good faith upon the information available to it, and communicated its position promptly. Every act of this Defendant in the handling of the claim was reasonable, lawful and consistent with KRS 304.12-230." },

    { key: "badfaith-advice-of-counsel",
      part: "badfaith",
      label: "Reliance on counsel and on the investigation",
      tag: "[WAIVER RISK]",
      note: "Pleading reliance on counsel can open the privilege. Clear it with the carrier before this one goes in the Answer.",
      body: "The positions taken by this Defendant in the handling of the claim were taken in good faith and in reliance upon the advice of counsel and upon the reports of its investigators and consultants." },

    { key: "badfaith-plaintiff-conduct",
      part: "badfaith",
      label: "Delay caused by the Plaintiff",
      body: "Any delay in the evaluation or payment of the claim resulted from the Plaintiff's failure to provide the documentation, authorizations, statements and examinations that the policy and the applicable statutes require, and not from any act or omission of this Defendant." },

    { key: "badfaith-no-damages",
      part: "badfaith",
      label: "No damages caused by the claim handling",
      body: "The Plaintiff sustained no damages caused by the handling of the claim. The emotional and consequential damages alleged, if any were sustained, were caused by the underlying loss rather than by any act or omission of this Defendant." },

    { key: "badfaith-bifurcation",
      part: "badfaith",
      label: "Demand for bifurcation and stay",
      body: "This Defendant demands that the extracontractual claims be bifurcated from the underlying claim and stayed, together with all discovery directed to the claim file and to reserves, until the underlying claim has been resolved." },

    /* ---------------------------------------------------------------
       VI. PUNITIVE DAMAGES
       --------------------------------------------------------------- */

    { key: "punitive-standard",
      part: "punitive",
      label: "Punitive damages standard not met",
      body: "The Plaintiff cannot prove by clear and convincing evidence that this Defendant acted toward the Plaintiff with oppression, fraud or malice as KRS 411.184 requires, and the claim for punitive damages must be dismissed." },

    { key: "punitive-no-supporting-facts",
      part: "punitive",
      label: "No conduct supporting punitive damages",
      note: "Move on punitives at the close of discovery. Keeping the claim out of the instructions is worth more than any argument about the number.",
      body: "The Complaint alleges ordinary negligence and nothing more. No conduct described in it reflects a flagrant indifference to the rights of others or a subjective awareness that harm was likely to result, and no instruction on punitive damages is warranted." },

    { key: "punitive-vicarious",
      part: "punitive",
      label: "No vicarious liability for punitive damages",
      body: "Punitive damages may not be assessed against this Defendant for the act of an agent or employee unless this Defendant authorized or ratified that conduct or should have anticipated it, as KRS 411.184(3) provides, and no such authorization, ratification or anticipation occurred." },

    { key: "punitive-due-process",
      part: "punitive",
      label: "Constitutional limits on punitive damages",
      body: "An award of punitive damages upon the facts alleged would violate the Due Process Clause of the Fourteenth Amendment to the United States Constitution and Section 2 of the Constitution of Kentucky. Any award must bear a reasonable relationship to the compensatory damages proved and to the reprehensibility of the conduct shown." },

    { key: "punitive-excessive-fines",
      part: "punitive",
      label: "Excessive fines",
      body: "An award of punitive damages upon the facts alleged would constitute an excessive fine prohibited by the Eighth Amendment to the United States Constitution and by Section 17 of the Constitution of Kentucky." },

    { key: "punitive-statutory-factors",
      part: "punitive",
      label: "Statutory factors weigh against an award",
      body: "Any award of punitive damages is governed by the factors the trier of fact must consider under KRS 411.186, including the likelihood that the conduct would cause the harm, the degree of the defendant's awareness of that likelihood, any profitability of the conduct and its duration, and each of those factors weighs against an award in this action." },

    { key: "punitive-no-compensatory",
      part: "punitive",
      label: "No punitive award without compensatory damages",
      body: "Punitive damages may not be awarded in the absence of an award of compensatory damages, and the Plaintiff is entitled to no compensatory recovery from this Defendant." },

    { key: "punitive-bifurcation",
      part: "punitive",
      label: "Bifurcation of the punitive damages phase",
      note: "Net worth discovery is the pressure point. Move to bifurcate early, before the interrogatory answers come due.",
      body: "This Defendant demands that the claim for punitive damages, and all discovery into its financial condition and net worth, be bifurcated and deferred until the trier of fact has determined liability and compensatory damages." },

    { key: "punitive-remittitur",
      part: "punitive",
      label: "Post-verdict review and remittitur",
      body: "Any award of punitive damages is subject to review by this Court and on appeal for excessiveness, and this Defendant reserves its right to seek remittitur, judgment notwithstanding the verdict and a new trial." },

    /* ---------------------------------------------------------------
       VII. PREMISES
       --------------------------------------------------------------- */

    { key: "premises-open-obvious",
      part: "premises",
      label: "Open and obvious condition",
      note: "Kentucky sends open and obvious to the jury as comparative fault. Plead it as fault and try it that way.",
      body: "The condition of which the Plaintiff complains was open, obvious and apparent to a person exercising ordinary care for that person's own safety, and the Plaintiff's failure to observe and avoid it is to be considered in the allocation of fault under KRS 411.182." },

    { key: "premises-natural-accumulation",
      part: "premises",
      label: "Natural accumulation of snow and ice",
      note: "Pull the hourly weather observations for the day before the fall. The record either makes this defense or ends it.",
      body: "The condition alleged was a natural outdoor accumulation of snow, ice or water, the hazards of which were obvious to any person on the premises, and this Defendant had no duty to remove it or to warn of a condition arising from the weather then prevailing." },

    { key: "premises-no-notice",
      part: "premises",
      label: "No notice of the condition",
      body: "This Defendant neither created the condition alleged nor had actual or constructive notice of it. The condition, if it existed at all, had not existed for a length of time sufficient to permit its discovery and correction in the exercise of ordinary care." },

    { key: "premises-no-defect",
      part: "premises",
      label: "No defect in the premises",
      body: "The premises were in a reasonably safe condition for the use for which they were intended, and no defect, hazard or unreasonably dangerous condition existed at the time and place described in the Complaint." },

    { key: "premises-status-of-entrant",
      part: "premises",
      label: "Status of the entrant",
      body: "The Plaintiff entered the premises as a licensee rather than as an invitee, and this Defendant owed no duty other than to refrain from wilful or wanton conduct and to warn of hidden dangers actually known to it." },

    { key: "premises-comparative-fault",
      part: "premises",
      label: "Comparative fault of the entrant",
      body: "The Plaintiff failed to exercise ordinary care for the Plaintiff's own safety, including by failing to watch where the Plaintiff was walking, by wearing footwear unsuited to the conditions then existing, and by choosing a route other than the one provided. Any recovery must be reduced by the Plaintiff's share of the fault under KRS 411.182." },

    { key: "premises-warning",
      part: "premises",
      label: "Adequate warning given",
      body: "This Defendant warned of the condition alleged by signage and by other means reasonably calculated to bring it to the attention of persons upon the premises, and the warning given satisfied any duty owed to the Plaintiff." },

    { key: "premises-recreational-use",
      part: "premises",
      label: "Recreational use immunity",
      tag: "[LAND OPEN FOR RECREATION]",
      body: "The Plaintiff entered the land for recreational purposes and without charge, and the duties and liability of this Defendant are limited by KRS 411.190." },

    { key: "premises-third-party-crime",
      part: "premises",
      label: "Criminal act of a third person",
      body: "The harm alleged was inflicted by the criminal act of a third person. This Defendant had no duty to anticipate or to guard against that act, which was not reasonably foreseeable and which no security measure would have prevented." },

    { key: "premises-out-of-possession",
      part: "premises",
      label: "Out of possession landlord",
      body: "This Defendant was an out of possession landlord with no control over the area in which the Plaintiff was injured. Possession and control had passed to the tenant under a written lease, and this Defendant had no duty to inspect, repair or maintain that area." },

    { key: "premises-contractor-hazard",
      part: "premises",
      label: "Hazard within the contractor's own work",
      body: "The condition alleged arose within the work an independent contractor was retained to perform, and the owner of the premises owed no duty to protect that contractor or its employees against the very hazard the contractor was engaged to address." },

    { key: "premises-dram-shop",
      part: "premises",
      label: "Consumption rather than service as the proximate cause",
      tag: "[LICENSED SELLERS]",
      body: "The consumption of intoxicating beverages, rather than their service, sale or furnishing, is the proximate cause of the injuries alleged, and the liability of this Defendant is limited by KRS 413.241." },

    /* ---------------------------------------------------------------
       VIII. SPECIALTY
       --------------------------------------------------------------- */

    { key: "specialty-products-state-of-art",
      part: "specialty",
      label: "State of the art",
      body: "The design, the methods of manufacture and testing, and the warnings furnished for the product at issue conformed to the generally recognized and prevailing standards and to the state of the art in existence at the time the product was designed, manufactured and sold, and the product is presumed not to have been defective under KRS 411.310." },

    { key: "specialty-products-presumption",
      part: "specialty",
      label: "Statutory presumption of nondefectiveness",
      note: "Date of first sale and date of manufacture, both. Photograph the serial plate before the product goes back into storage.",
      body: "The product at issue is presumed not to have been defective under KRS 411.310, the injury alleged having occurred after the periods that statute prescribes following the sale of the product to the first consumer and following its date of manufacture." },

    { key: "specialty-products-misuse",
      part: "specialty",
      label: "Product misuse",
      body: "The Plaintiff failed to exercise ordinary care in the use of the product and used it in a manner and for a purpose for which it was not intended and against which it was warned. That misuse was a substantial cause of the occurrence, and recovery is barred or limited by KRS 411.320." },

    { key: "specialty-products-alteration",
      part: "specialty",
      label: "Alteration and modification",
      body: "The product was altered and modified after it left the control of the manufacturer and was not in its original, unaltered and unmodified condition at the time of the occurrence. That alteration was a substantial cause of the occurrence, and liability is limited by KRS 411.320." },

    { key: "specialty-products-seller",
      part: "specialty",
      label: "Nonmanufacturing seller entitled to dismissal",
      tag: "[NONMANUFACTURING SELLER]",
      body: "This Defendant is a wholesaler, distributor or retailer that sold the product in the original manufactured condition and package in which it was received. The manufacturer is identified and subject to the jurisdiction of this Court, and this Defendant is entitled to dismissal under KRS 411.340." },

    { key: "specialty-construction-repose",
      part: "specialty",
      label: "Construction limitations and repose",
      tag: "[IMPROVEMENTS TO REALTY]",
      note: "Kentucky's construction repose statute has not survived constitutional challenge, so never rest this defense on that section alone. Fix the substantial completion date first, from the certificate of occupancy rather than the contract, and plead limitations from that date.",
      body: "The claims arising out of the design and construction of an improvement to real property are barred, in whole or in part, by the applicable statutes of limitation and of repose. The improvement at issue was designed, constructed and substantially completed years before the events described in the Complaint, and this action was commenced after every applicable period had run from the date of substantial completion." },

    { key: "specialty-construction-economic-loss",
      part: "specialty",
      label: "Economic loss rule",
      body: "The Plaintiff seeks recovery in tort for damage to the improvement or the product itself and for the economic losses flowing from that damage. Those losses are recoverable, if at all, under the contract between the parties, and the tort claims are barred by the economic loss rule." },

    { key: "specialty-independent-contractor",
      part: "specialty",
      label: "No liability for an independent contractor",
      body: "The work alleged to have caused the injuries was performed by an independent contractor over whose methods and details this Defendant exercised no control, and this Defendant is not liable for the acts or omissions of that contractor or its employees." },

    { key: "specialty-employment-exhaustion",
      part: "specialty",
      label: "Failure to exhaust administrative remedies",
      note: "Election of remedies under KRS 344.270 is jurisdictional. Ask in the first interrogatories whether a charge was filed, and with which commission.",
      body: "The Plaintiff failed to exhaust the administrative remedies that are a condition precedent to the claims asserted, and to the extent the Plaintiff elected to pursue the same claims before a commission, this Court is without jurisdiction over them under KRS 344.270." },

    { key: "specialty-employment-after-acquired",
      part: "specialty",
      label: "After-acquired evidence",
      note: "The doctrine cuts damages off at the date of discovery. Plead it the moment the resume or the expense report turns up.",
      body: "Evidence acquired after the employment relationship ended establishes conduct that would have resulted in the Plaintiff's termination had it been known at the time, and that evidence bars or limits the reinstatement, front pay and back pay the Plaintiff seeks." },

    { key: "specialty-employment-at-will",
      part: "specialty",
      label: "Employment at will and legitimate business reasons",
      body: "The Plaintiff's employment was terminable at will by either party, and every employment decision of which the Plaintiff complains was made for legitimate, nondiscriminatory and nonretaliatory business reasons." },

    { key: "specialty-workers-comp",
      part: "specialty",
      label: "Workers compensation exclusive remedy",
      tag: "[EMPLOYER DEFENDANTS]",
      body: "The Plaintiff's exclusive remedy for the injuries alleged is provided by the Workers Compensation Act, and KRS 342.690 bars this action against this Defendant as the employer of the Plaintiff or as a contractor deemed to be the employer." },

    { key: "specialty-dealer-as-is",
      part: "specialty",
      label: "Disclaimer of implied warranties",
      body: "The sale was made without any implied warranty of merchantability or of fitness for a particular purpose. The implied warranties were excluded by a conspicuous written disclaimer satisfying KRS 355.2-316, and the goods were accepted in their existing condition." },

    { key: "specialty-dealer-consumer-protection",
      part: "specialty",
      label: "Consumer protection claim unavailable",
      body: "The Plaintiff cannot maintain a claim under the Kentucky Consumer Protection Act. The Plaintiff is not in privity with this Defendant, the conduct alleged is neither unfair, false, misleading nor deceptive within the meaning of KRS 367.170, and the claim is barred by the limitation period of KRS 367.220." },

    { key: "specialty-coverage-no-coverage",
      part: "specialty",
      label: "No coverage under the policy",
      body: "The policy of insurance issued by this Defendant affords no coverage for the loss described in the Complaint. Coverage is governed and limited by the terms, definitions, conditions, exclusions and limits of liability of the policy, which is pleaded as though set out in full herein." },

    { key: "specialty-coverage-late-notice",
      part: "specialty",
      label: "Late notice and breach of policy conditions",
      body: "The insured failed to give notice of the occurrence and of the claim as soon as practicable, failed to forward the suit papers, and failed to cooperate in the defense as the policy requires, and this Defendant has been prejudiced by each of those failures." },

    { key: "specialty-coverage-misrepresentation",
      part: "specialty",
      label: "Misrepresentation in the application",
      body: "The policy was issued in reliance upon material misrepresentations in the application which, had the truth been disclosed, would have caused this Defendant to decline the risk or to issue the policy upon different terms. This Defendant reserves its right to rescind or to avoid the policy under KRS 304.14-110." }

  ];

})(window.C = (window.C || {}));

/* ===================================================================

   C.pack.OBJECTIONS: the fifteen discovery objection modules the firm

  var REPLY = caption()

    .concat([
      { k: "blank", t: "" },
      { k: "title", t: "DEFENDANT'S REPLY IN SUPPORT OF", u: true },
      { k: "title", t: "MOTION FOR SUMMARY JUDGMENT", u: true },
      { k: "blank", t: "" },

      { k: "body", t: "Comes the Defendant, Fairway Freight, Inc., by counsel, and for its Reply in Support of its Motion for Summary Judgment, states as follows:" },

      { k: "body", t: "Plaintiff's Response identifies no medical proof that carries her over the threshold of KRS 304.39-060(2)(b). It offers her own affidavit and a bundle of chiropractic charges her treating physician did not order and cannot relate to this collision. It answers the negligent hiring and retention claim in two sentences, and the punitive damages argument with adjectives in place of proof. There is no genuine issue as to any material fact, and Fairway Freight is entitled to judgment as a matter of law." },

      { k: "body", t: "Summary judgment is governed by CR 56.03, which provides:" },
      { k: "quote", t: "The judgment sought shall be rendered forthwith if the pleadings, depositions, answers to interrogatories, stipulations, and admissions on file, together with the affidavits, if any, show that there is no genuine issue as to any material fact and that the moving party is entitled to a judgment as a matter of law." },
      { k: "body", t: "A party opposing a properly supported motion may not rest on her pleading or on her own characterization of her condition. She must come forward with affirmative evidence, admissible at trial, on every element she carries the burden to prove. Where that element is medical causation or permanency, the evidence must be medical. Plaintiff's deadline to disclose expert witnesses expired on June 30, 2026, and she disclosed no one." },

      { k: "head", t: "I. PLAINTIFF CANNOT SATISFY THE THRESHOLD OF KRS 304.39-060(2)(b)." },

      { k: "body", t: "Kentucky has partially abolished tort liability for injuries arising out of the use of a motor vehicle, and Plaintiff did not reject that limitation. Under KRS 304.39-060(2)(b), she may recover damages in tort for pain, suffering, mental anguish and inconvenience:" },
      { k: "quote", t: "only in the event that the benefits which are payable for such injury as \"medical expense\" or which would be payable but for any exclusion or deductible authorized by this subtitle exceed one thousand dollars, or the injury or disease consists in whole or in part of permanent disfigurement, a fracture to a bone, a compound, comminuted, displaced or compressed fracture, loss of a body member, permanent injury within reasonable medical probability, permanent loss of bodily function or death." },

      { k: "body", t: "Plaintiff clears none of those prongs. The charges attributable to this collision total nine hundred forty-two dollars and sixty cents, a figure taken from the ledger of Plaintiff's own reparation obligor, Birdie Mutual Insurance Company, which paid every related charge from the urgent care visit of March 17, 2026 through Dr. Lorena Fescue's release of Plaintiff on May 28, 2026. (Motion, Ex. 3.) The Response disputes not one line of it. It adds to it, taking one thousand four hundred sixty dollars in chiropractic charges incurred from June 8, 2026 and reporting the sum as though the statute counted every charge a plaintiff can produce. (Response, Ex. B.)" },

      { k: "body", t: "Those charges do not count. The statute reaches benefits \"payable for such injury,\" and it reaches an unpaid charge only where the charge \"would be payable but for any exclusion or deductible authorized by this subtitle.\" Birdie Mutual denied these charges on June 30, 2026 as unrelated to this collision, and a denial for want of a causal relation is neither an exclusion nor a deductible. The Response answers that the denial was a claims decision rather than a medical finding. The medical finding belongs to Plaintiff's own physician, who did not order this care and cannot relate it to this collision. (Motion, Ex. 2, Fescue Dep. 66:12-21.)", fn: 1 },
      { k: "foot", n: 1, t: "Plaintiff did not identify the chiropractor in her discovery responses served June 15, 2026, although that care had begun a week earlier and Interrogatory No. 5 called for it, and she never supplemented under CR 26.05. She produced the records on the morning of her deposition, June 24, 2026, which was adjourned so that counsel could review them and resumed on July 14, 2026." },

      { k: "body", t: "Plaintiff's own testimony supplies the reason those charges are unrelated. On June 4, 2026 she lifted a case of stock at work and felt her low back catch, and she began chiropractic care four days later. (Divot Dep. Vol. II, 27:4-19.) She conceded that no physician has ever told her that treatment had anything to do with this collision. (Divot Dep. Vol. II, 33:8-21.)" },

      { k: "body", t: "The remaining prongs are matters of record. The radiographs of March 17, 2026 were read as negative for acute fracture, and Dr. Fescue confirmed that reading under oath. (Motion, Ex. 2, Fescue Dep. 31:4-12.) There is no disfigurement, no loss of a body member and no death. What is left is permanency, and permanency requires medical proof that Plaintiff's own treating physician will not give. Dr. Fescue released her at maximum medical improvement on May 28, 2026 with no restrictions and no impairment rating (Motion, Ex. 2, Fescue Dep. 44:20-45:6), and testified that she could not state within reasonable medical probability that Plaintiff sustained a permanent injury (Motion, Ex. 2, Fescue Dep. 58:9-59:3). Plaintiff has seen no physician since that release. (Divot Dep. Vol. II, 41:15-42:8.)" },

      { k: "body", t: "The Response answers with Plaintiff's affidavit, which states that she still has pain and believes her injuries are permanent. (Response, Ex. A, PP 5-7.) A belief about permanency is not medical proof, and the cause and duration of a soft tissue injury lie outside common knowledge. The Response adds that a release at maximum medical improvement means only that treatment has run its course, which is an argument about what the release implies and not the opinion Dr. Fescue declined to give. It also cannot be squared with her testimony that no physician has called her injury permanent and that she returned to full duty without restriction. (Divot Dep. 61:3-14; 84:11-19.)", fn: 2 },
      { k: "foot", n: 2, t: "The physical evidence points the same direction. The change in velocity of Plaintiff's vehicle was less than eight miles per hour, and Plaintiff declined transport and drove her vehicle from the scene. (Motion, Ex. 6, PP 9-11; Divot Dep. 57:2-13.)" },

      { k: "head", t: "II. THE NEGLIGENT HIRING AND RETENTION CLAIM FAILS AS A MATTER OF LAW." },

      { k: "body", t: "A claim that an employer negligently hired or retained a driver requires proof of the employer's own breach: that it knew or should have known the driver was unfit and put him behind the wheel anyway. The Response identifies no such proof because the record holds none. The driver qualification file of Sandy Pitchmark was produced in full on June 3, 2026 at FF 000112 through FF 000198, and Plaintiff's counsel examined Mr. Pitchmark about it. (Motion, Ex. 4; Motion, Ex. 5, Pitchmark Dep. 27:5-19.)" },

      { k: "body", t: "The file satisfies 49 C.F.R. Part 391 in every particular. It contains the employment application required by 49 C.F.R. 391.21, executed February 24, 2022; the safety performance history investigation and driving record inquiries required by 49 C.F.R. 391.23, completed March 2, 2022; the commercial driver's license accepted under 49 C.F.R. 391.33 in lieu of a road test; the medical examiner's certificate issued November 12, 2025 under 49 C.F.R. 391.43; and the annual inquiry and review of the driving record required by 49 C.F.R. 391.25, completed January 9, 2026. Each is an item 49 C.F.R. 391.51 requires, and each is there." },

      { k: "body", t: "What the file contains matters as much as its completeness. Mr. Pitchmark held an unrestricted commercial driver's license, was medically certified, and had four years with Fairway Freight without a preventable accident or a moving violation. The annual review of his driving record, conducted sixty-four days before this collision, returned no convictions and no reportable accidents. (Motion, Ex. 4, FF 000174.) An employer does not breach a duty by retaining a driver qualified under the federal standard whose record gives no warning, and Plaintiff never says what Fairway Freight should have learned or done differently." },

      { k: "body", t: "The count adds nothing for a second and independent reason. Fairway Freight admitted in its Answer that Mr. Pitchmark was its employee and was acting within the course and scope of his employment. (Answer, P 5; Motion, Ex. 5, Pitchmark Dep. 12:17-21; 13:7-14.) With that admission of record the employer answers for the driver's fault if any fault is found, every compensatory element Plaintiff pleads is already recoverable on the admitted claim, and the derivative count supplies no additional element of damage. Its remaining office is to open a punitive damages theory against the employer, which fails below." },

      { k: "body", t: "The Response devotes two sentences to this count. It asserts that the file speaks for itself and asks that a jury weigh it. A jury weighs disputed facts. Plaintiff deposed no safety officer, served no discovery directed to hiring, training or supervision, and identifies no document she sought and was denied. There is nothing here to weigh." },

      { k: "head", t: "III. THE PUNITIVE DAMAGES CLAIM FAILS UNDER KRS 411.184." },

      { k: "body", t: "KRS 411.184(2) provides that a plaintiff \"shall recover punitive damages only upon proving, by clear and convincing evidence, that the defendant from whom such damages are sought acted toward the plaintiff with oppression, fraud or malice.\" Oppression is conduct specifically intended to subject the plaintiff to cruel and unjust hardship. Malice is conduct specifically intended to cause tangible or intangible injury to the plaintiff, or conduct carried out with a flagrant indifference to the plaintiff's rights and with a subjective awareness that it will result in human death or bodily harm. Fraud is neither pleaded nor argued." },

      { k: "body", t: "The record contains none of it. This case is a disputed lane change on a Saturday afternoon. Mr. Pitchmark was not cited and testified that he signaled and checked his mirrors before moving into the center lane. (Motion, Ex. 5, Pitchmark Dep. 51:8-22.) His logs show six hours and forty minutes of driving time in the applicable window, well inside 49 C.F.R. 395.3. (Motion, Ex. 7, FF 000201-216.) Plaintiff testified that the vehicle ahead of her stopped abruptly. (Divot Dep. 42:7-22.) The Response calls that conduct reckless, indifferent and outrageous. Characterization drawn from a brief is not clear and convincing evidence, and this conduct would not satisfy a gross negligence standard under any formulation." },

      { k: "body", t: "KRS 411.184(3) supplies an independent bar. It provides that \"in no case shall punitive damages be assessed against a principal or employer for the act of an agent or employee unless such principal or employer authorized or ratified or should have anticipated the conduct in question.\" Plaintiff identifies no authorization, no ratification, and no fact that would have put Fairway Freight on notice to anticipate a lane change by a driver holding a current medical certificate and a clean record." },

      { k: "wherefore", t: "WHEREFORE, the Defendant, Fairway Freight, Inc., respectfully requests that the Court grant its Motion for Summary Judgment, dismiss the Complaint with prejudice, award its costs herein expended, and grant all other relief to which it may appear entitled." },

  W.open = function (docKey) {
    if (win) { win.focus(); return win; }
    var box = C.wm.desk();
    var w = Math.min(1360, box.clientWidth - 96);
    /* Leave the Dock its strip, the way a window opens on a real desk. */
    var h = Math.min(900, box.clientHeight - 110);

    elTabs = tabStrip();
    elRibbon = C.el("div#wd-ribbon.wd-ribbon", { role: "tabpanel", "aria-labelledby": "rtab-home" });
    elRuler = ruler();
    elStatus = statusBar();
    /* The ruler belongs to the document column, not to the window, or
       it stops lining up with the paper the moment the pane opens. */
    elWork = C.el("div.wd-work", null, [
      C.el("div.doc-col", null, [elRuler, C.el("div#doc-canvas.thin-scroll")]),
      C.el("aside#pane-col.pane-col", { hidden: true })
    ]);

    win = C.wm.create({
      id: "word",
      title: "Word",
      cls: "win-word",
      titleBar: titleBar(),
      x: Math.round((box.clientWidth - w) / 2),
      y: 22,
      w: w, h: h,
      /* Word opens filling the desk. The geometry above is what the
         green light returns it to, and what a drag on the title bar
         pulls it down to. On a phone this is the difference between a
         document and a postage stamp. */
      zoomed: true,
      minW: 780, minH: 520,
      dockIconEl: function () { return C.$("dock-word"); },
      onClose: function () { win = null; C.store.set("desk.wordOpen", false); C.scene.toDesk(); },
      onResize: function () { C.docview.sizeScale(); }
    });

    C.add(win.body, [elTabs, elRibbon, elWork, elStatus]);
    C.docview.mount(C.$("doc-canvas"));
    setRibbon("home");
    wire();
    C.reg.paint(win.el);

    /* Publish the starting zoom so the paper and the ruler agree from
       the first frame, rather than from the first change. */
    C.store.emit("word.zoom", C.store.get("word.zoom"));

    var doc = pick(docKey);
    C.doc.load(doc);
    C.docview.rebuild();
    syncTitle();
    C.store.set("desk.wordOpen", true);
    return win;
  };

  function pick(key) {
    var list = (C.pack && C.pack.DOCS) || [];
    for (var i = 0; i < list.length; i++) if (list[i].key === key) return list[i];
    return list[0] || { key: "blank", name: "Document1.docx", title: "Document1", blocks: [] };
  }

  W.load = function (key) {

    C.doc.load(d);
    C.docview.rebuild();
    syncTitle();
    C.status("Opened " + d.name + ".", "ok");

    var tail = elTitle.lastChild;

      ? "\u2014 Edited" : "\u2014 Compatibility Mode";

    C.store.set("word.ribbon", which);
    C.clear(elRibbon);
    C.add(elRibbon, (RIBBON[which] || RIBBON.home)());
    C.qa(".rtab", elTabs).forEach(function (t) {

      t.setAttribute("aria-selected", on ? "true" : "false");
      t.classList.toggle("on", on);

  /* ---- live wiring ---------------------------------------------------- */

  /* Page setup. Every one of these is a control that would otherwise
     set a flag and draw nothing, which is the failure this build
     exists to end. Geometry changes remeasure and repaginate, the way
     Word does when a margin or an orientation changes. */
  var MARGINS = { narrow: 50, normal: 78, wide: 104 };

  function paintPage() {
    var canvas = C.$("doc-canvas");
    if (!canvas) return;
    var w = C.store.get("word");
    var m = MARGINS[w.margins || "normal"] || 78;
    var land = !!w.landscape;
    var sheetW = land ? 854 : 660;
    var sheetH = land ? 660 : 854;

    /* Geometry goes on the column so the ruler and the paper read the
       same numbers. Orientation would otherwise leave the ruler behind. */
    var colEl = C.q(".doc-col") || canvas;
    colEl.style.setProperty("--sheet-w", sheetW + "px");
    colEl.style.setProperty("--sheet-h", sheetH + "px");
    colEl.style.setProperty("--pad", m + "px");
    colEl.style.setProperty("--body-h", (sheetH - m * 2) + "px");
    canvas.classList.toggle("with-header", !!w.header);
    canvas.classList.toggle("with-footer", !!(w.footer || w.pagenum));
    canvas.classList.toggle("with-pagenum", !!w.pagenum);
    canvas.classList.toggle("watermarked", !!w.watermark);
    canvas.classList.toggle("lined", !!w.lines);
    canvas.className = (canvas.className
      .replace(/\b(theme|docfont)-\S+/g, "") + " theme-" + (w.theme || "court") +
      " docfont-" + (w.docfont || "times")).replace(/\s+/g, " ").trim();

    /* The running head and the footer are text, and CSS content is the
       only place a pseudo-element can read it from. */
    canvas.style.setProperty("--header-text",
      '"' + (C.pack.MATTER ? C.pack.MATTER.plaintiff + " v. " + C.pack.MATTER.defendant : "") + '"');
    canvas.style.setProperty("--footer-text",
      '"' + (C.doc.meta.name || "") + '"');

    C.docview.measure();
    C.docview.rebuild();
  }

  W.paintPage = paintPage;

  var wired = false;
  function wire() {
    if (wired) return;
    wired = true;
    ["margins", "landscape", "header", "footer", "pagenum", "watermark",
     "lines", "theme", "docfont"].forEach(function (k) {
      C.store.on("word." + k, paintPage);
    });

    C.store.on("doc.pages", paintStatus);
    C.store.on("doc.words", paintStatus);
    C.store.on("doc.title", syncTitle);
    C.store.on("doc.dirty", syncTitle);
    C.store.on("word.zoom", function (z) {
      document.documentElement.style.setProperty("--doc-zoom", z);
      var pct = Math.round(z * 100);
      var el = C.$("sb-pct"); if (el) el.textContent = pct + "%";
      var sl = C.$("sb-zoom"); if (sl && +sl.value !== pct) sl.value = pct;
      C.docview.sizeScale();
    });
    C.store.on("word.marks", function (on) {
      C.$("doc-canvas").classList.toggle("marks", !!on);
    });
    C.store.on("word.ruler", function (on) { elRuler.hidden = !on; });
    C.store.on("word.focus", function (on) {
      win.el.classList.toggle("focus-mode", !!on);
    });
    C.store.on("doc.rendered", paintStatus);

    var canvas = C.$("doc-canvas");
    canvas.addEventListener("scroll", C.debounce(paintStatus, 60));

    /* Light every paragraph sharing a content-control tag as one run,
       from the pointer and from the caret alike. */
    canvas.addEventListener("mouseover", function (e) { litFrom(e.target); });
    canvas.addEventListener("mouseleave", function () { lit(null); });
    document.addEventListener("selectionchange", function () {
      var s = window.getSelection();
      if (s && s.rangeCount) litFrom(s.getRangeAt(0).startContainer);
    });

    if (!wire._doc) {
      wire._doc = true;
      document.addEventListener("keydown", shortcuts);
    }
  }

  function litFrom(node) {
    var el = node && (node.nodeType === 1 ? node : node.parentElement);
    var p = el && el.closest ? el.closest(".p[data-ctl]") : null;
    lit(p ? p.dataset.ctl : null);
  }

  var litTag = null;
  function lit(tag) {
    if (litTag === tag) return;
    litTag = tag;
    C.qa(".p.ctl-lit").forEach(function (el) { el.classList.remove("ctl-lit"); });
    if (!tag) return;
    C.qa('.p[data-ctl="' + tag + '"]').forEach(function (el) { el.classList.add("ctl-lit"); });
  }

  function paintStatus() {
    var p = C.$("sb-page"), w = C.$("sb-words");
    if (!p) return;
    var pages = C.store.get("doc.pages") || 1;
    p.textContent = "Page " + currentPage() + " of " + pages;
    w.textContent = (C.store.get("doc.words") || 0).toLocaleString() + " words";
  }

  function currentPage() {
    var canvas = C.$("doc-canvas");
    var host = C.docview.host;
    if (!canvas || !host) return 1;
    var z = C.store.get("word.zoom") || 1;
    var sheets = C.qa(".sheet", host);
    var top = canvas.scrollTop / z;
    var best = 1;
    for (var i = 0; i < sheets.length; i++) {
      if (sheets[i].offsetTop - 40 <= top) best = i + 1;
    }

/* =====================================================================
   41-word-find.js   find in the document, and the spelling pass.

   Find marks ranges rather than rewriting the document. Where the
   Custom Highlight API exists it is used, because a highlight cannot

   fallback wraps matches and strips them again before the model is

      type: "search", placeholder: "Find in document",
      "aria-label": "Find in document"

      C.node(C.svg.icon("search", 14)),
      input,
      count,
      C.el("button.find-nav", { type: "button", title: "Previous", "aria-label": "Previous match" },
        [C.node(C.svg.icon("chevUp", 14))]),
      C.el("button.find-nav", { type: "button", title: "Next", "aria-label": "Next match" },
        [C.node(C.svg.icon("chevDown", 14))]),
      C.el("button.find-close", { type: "button", title: "Close", "aria-label": "Close find" },
        [C.node(C.svg.icon("close", 14))])
    ]);

    navs[0].addEventListener("click", function () { step(-1); });

    input.addEventListener("input", C.debounce(run, 140));

    if (HL) { HL.clear(); }
    C.qa("mark.find", host()).forEach(function (m) {
      var p = m.parentNode;
      while (m.firstChild) p.insertBefore(m.firstChild, m);
      p.removeChild(m);

    var q = input.value.trim();
    clear();
    if (q.length < 2) { count.textContent = ""; C.store.set("word.find", { q: q, hits: 0, at: 0 }); return; }

    var h = host();
    if (!h) return;
    var walker = document.createTreeWalker(h, NodeFilter.SHOW_TEXT, null);
    var node, needle = q.toLowerCase();
    var found = [];
    while ((node = walker.nextNode())) {
      var text = node.nodeValue.toLowerCase();
      var i = text.indexOf(needle);
      while (i >= 0) {
        var r = document.createRange();
        r.setStart(node, i);
        r.setEnd(node, i + q.length);

        i = text.indexOf(needle, i + q.length);

      HL = new Highlight();
      hits.forEach(function (r) { HL.add(r); });

         read-back, so they never reach the model. */

    C.store.set("word.find", { q: q, hits: hits.length, at: hits.length ? 1 : 0 });
    if (hits.length) { at = -1; step(1); }

    if (!hits.length) return;
    at = (at + d + hits.length) % hits.length;
    count.textContent = (at + 1) + " of " + hits.length;
    var r = hits[at];
    var el = r.startContainer.parentElement && r.startContainer.parentElement.closest(".p");
    if (el) C.docview.reveal(el.dataset.bid, false);
    C.qa("mark.find.on", host()).forEach(function (m) { m.classList.remove("on"); });
    if (!C.env.highlights) {
